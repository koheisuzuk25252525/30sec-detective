:root{--electric:#a5ffe3;--deep:#091220;--hot:#ffd887}

.tapword:active{background:#6c8fa9;transform:scale(.92)}.tapword.wrong{background:#672e3b;color:#ffdedb;text-decoration:line-through}
.speech-tail{font-size:18px;white-space:normal}
.tap-instruction{text-align:center;color:#a1f5d5;font-weight:950;font-size:14px;margin:16px 0 7px}
.instruction-feedback{min-height:34px;font-size:12px;font-weight:900;text-align:center;color:#ffc5b5}
.game-footer{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:7px;color:#a7bfd0;font-size:10px}.small-link{border:0;background:none;color:#bbcbd4;padding:8px;font-size:11px;text-decoration:underline}
.result-main{text-align:center;padding:22px 0 6px}.result-seal{font-size:69px;line-height:1.2;filter:drop-shadow(0 0 19px #f5d18e55)}.result-grade{font-size:65px;font-weight:1000;line-height:1.1;color:#ffde90;text-shadow:0 5px 0 #8e5d34,0 0 25px #ffc36870}.result-hero{font-size:25px;font-weight:950;margin:10px 0}.result-sub{font-size:13px;color:#bed4d8;margin:9px 0 18px}

.fill-btn{display:block;width:100%;background:linear-gradient(100deg,#ffdfa1,#f5b76c);color:#172b40;border:0;border-radius:13px;padding:14px 8px;margin-top:12px;font-size:15px;font-weight:950;box-shadow:0 4px 0 #8d6736}
.fill-btn.secondary{background:#1c384f;box-shadow:none;border:1px solid #57788a;color:#e1f0ec}
.archive-head{display:flex;justify-content:space-between;align-items:center}.archive-level{font-size:12px;color:#92e4cf;font-weight:850;margin:18px 0 8px}
.archive-card{border:1px solid #4c6c81;border-radius:10px;background:#172d42;margin:6px 0;overflow:hidden}.archive-card summary{list-style:none;cursor:pointer;display:flex;gap:10px;padding:11px 12px;align-items:center;font-size:13px;font-weight:800}.archive-card summary::-webkit-details-marker{display:none}.archive-card summary .id{color:#ffe3a7;font-size:11px}.archive-card summary .arrow{margin-left:auto;color:#9db7c1}

.archive-locked{border:1px dashed #435468;border-radius:10px;margin:5px 0;padding:12px;color:#849aac;font-size:12px}
.impact-overlay{position:fixed;inset:0;background:radial-gradient(circle at center,#664027,#141b2b 60%,#070e1b);display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:20px;z-index:100;isolation:isolate;animation:hitshake .42s ease-out}
.impact-light{position:absolute;inset:0;background:radial-gradient(circle,#fffefa 0%,#ffcd76 35%,#fb693d 65%,transparent 90%);animation:flashbang .72s forwards}
.impact-ring{position:absolute;inset:0;margin:auto;width:160px;height:160px;border:10px solid #fff2b1;border-radius:50%;box-shadow:0 0 90px #ffa746;animation:expandblast .85s forwards}
.impact-rays{position:absolute;inset:-70%;background:repeating-conic-gradient(from 5deg,transparent 0deg 9deg,#ffe6ad33 10deg 12deg,transparent 13deg 22deg);animation:spinray 1.1s ease-out}

.impact-kicker{font-size:12px;font-weight:950;letter-spacing:.24em;color:#9df6d8}
.impact-title{font-size:clamp(52px,15vw,82px);line-height:1.06;font-weight:1000;letter-spacing:-.075em;color:#ffe39c;text-shadow:0 6px 0 #ad4c2e,0 0 35px #ffac48;margin:8px 0}
.impact-word{display:inline-block;color:#fff0b4;border:1px solid #e6ae75;background:#483125;padding:5px 14px;border-radius:10px;font-size:20px;font-weight:950;animation:shred .75s .12s ease-out both}
.impact-reason{font-size:13px;color:#fff;line-height:1.6;font-weight:850;margin:12px 0 4px;text-shadow:0 1px 8px #050409}
.impact-bonus{color:#91ffe0;font-size:18px;font-weight:1000;text-shadow:0 0 20px #21e3b5}
.impact-foot{font-size:10px;color:#bdd7d4;margin-top:9px}
@keyframes flashbang{0%{opacity:1}20%{opacity:.65}100%{opacity:0}}
@keyframes expandblast{0%{transform:scale(.1);opacity:1}100%{transform:scale(6);opacity:0}}
@keyframes spinray{to{transform:rotate(70deg)}}
@keyframes blastbit{0%{transform:rotate(var(--deg)) translateY(0) scale(.15);opacity:.4}20%{opacity:1}100%{transform:rotate(var(--deg)) translateY(calc(-1 * var(--dist))) scale(.1);opacity:0}}
@keyframes hitshake{0%{transform:scale(.96)}10%{transform:translate(9px,-9px)}23%{transform:translate(-9px,7px)}36%{transform:translate(5px,-3px)}60%,100%{transform:none}}
@keyframes impacttitle{0%{transform:scale(2.2) rotate(-9deg);opacity:0}70%{transform:scale(.93) rotate(2deg);opacity:1}100%{transform:none;opacity:1}}
@keyframes shred{0%{transform:scale(2.4);filter:blur(8px);opacity:0}35%{opacity:1}100%{transform:scale(1);filter:none;opacity:1}}
@media(max-height:720px){.caseboard{padding:11px}.fact-line{min-height:30px;font-size:14px}.person-label{margin-top:9px}.speech{font-size:17px;line-height:2}.tapword{font-size:16px;padding:4px 2px;min-height:37px}.speech-tail{font-size:16px}.tap-instruction{margin-top:10px}}
@media(prefers-reduced-motion:reduce){.impact-overlay,.impact-light,.impact-ring,.impact-rays,.impact-bit,.impact-inner,.impact-word{animation:none!important}.impact-light,.impact-ring,.impact-rays,.impact-bit{display:none}.impact-overlay{background:#1b3046}}

let screen="home",currentId=null,wrongChoices=new Set(),timer=null,audio=null,mixer=null,motion=!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);
function store(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){}}
function today(){const parts=new Intl.DateTimeFormat("en",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());const obj=Object.fromEntries(parts.map(p=>[p.type,p.value]));return obj.year+"-"+obj.month+"-"+obj.day}
function digest(str){let x=2166136261;for(let i=0;i<str.length;i++){x=Math.imul(x^str.charCodeAt(i),16777619)>>>0}return x>>>0}
function makeRng(seed){let v=seed>>>0;return ()=>{v=(Math.imul(v,1664525)+1013904223)>>>0;return v/4294967296}}
function shuffled(items,seed){const arr=items.slice(),random=makeRng(seed);for(let i=arr.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function dailyId(){return "daily:"+today()}
function config(id){const clean=id==="daily"?dailyId():id;
 if(clean.startsWith("daily:")){const seed=digest(clean),pick=(l,n)=>shuffled(levelById[l].items.map(p=>p.id),seed+digest(l)).slice(0,n);return {id:clean,title:"今日の5問",icon:"📅",description:"毎日0時に更新",ids:[...pick("easy",2),...pick("standard",2),...pick("expert",1)]}}
 if(clean==="sprint"){const seed=digest("sprint:"+data.sprintNonce),pick=(l,n)=>shuffled(levelById[l].items.map(p=>p.id),seed+digest(l)).slice(0,n);return {id:clean,title:"5問ラッシュ",icon:"⚡",description:"サクッと1〜2分",ids:[...pick("easy",1),...pick("standard",2),...pick("expert",2)]}}
 if(clean==="ideas")return{id:clean,title:"ひらめき12問",icon:"✨",description:"新作12問の特選パック",ids:["easy-09","easy-10","easy-11","easy-12","standard-09","standard-10","standard-11","standard-12","expert-09","expert-10","expert-11","expert-12"]};
 if(clean==="all")return{id:clean,title:"全36問",icon:"🏆",description:"全問制覇に挑戦",ids:cases.map(p=>p.id)};
 if(levelById[clean])return{id:clean,title:levelById[clean].label,icon:levelById[clean].icon,description:levelById[clean].desc,ids:levelById[clean].items.map(p=>p.id)};
 return null}
function session(id){
 const c=config(id);if(!c)return null;
 if(!data.sessions[c.id]||!Array.isArray(data.sessions[c.id].ids))data.sessions[c.id]={ids:c.ids.slice(),index:0,solved:0,skipped:0,errors:0,streak:0,bestStreak:0,firstTry:0,points:0,bad:[],history:[]};
 const s=data.sessions[c.id];s.index=Math.min(Math.max(0,Number(s.index)||0),s.ids.length);if(!Array.isArray(s.bad))s.bad=[];if(!Array.isArray(s.history))s.history=[];
 return s}
function label(){soundButton.textContent=data.sound?"♪ ON":"♪ OFF";archiveButton.textContent="📂 "+Object.keys(data.archive).length+"/36"}
function sound(kind,combo=0){
 if(!data.sound)return;
 try{if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();mixer=audio.createDynamicsCompressor();mixer.threshold.value=-27;mixer.ratio.value=5;mixer.connect(audio.destination)}if(audio.state==="suspended")audio.resume()}catch(e){return}
 const tone=(start,delay,duration,type,vol,end)=>{const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(start,t);if(end)o.frequency.exponentialRampToValueAtTime(end,t+duration);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(mixer);o.start(t);o.stop(t+duration+.03)};
 if(kind==="win"){
 tone(108,0,.28,"sawtooth",.17,37);tone(240,0,.15,"square",.07,70);tone(590,.09,.14,"triangle",.10,880);tone(770,.20,.16,"sine",.13,1000);tone(1040,.32,.22,"triangle",.12);if(combo>=3){tone(1320,.44,.18,"sine",.10);tone(1640,.55,.2,"sine",.10)} 
 const size=Math.round(audio.sampleRate*.2),buff=audio.createBuffer(1,size,audio.sampleRate),samples=buff.getChannelData(0);for(let i=0;i<size;i++)samples[i]=(Math.random()*2-1)*(1-i/size);const n=audio.createBufferSource(),gain=audio.createGain();gain.gain.value=.15;n.buffer=buff;n.connect(gain);gain.connect(mixer);n.start()
 }else if(kind==="wrong"){tone(220,0,.12,"triangle",.08,150);tone(150,.11,.14,"triangle",.07,100)}else tone(700,0,.065,"sine",.04)
}
function vibrate(pattern){try{navigator.vibrate&&navigator.vibrate(pattern)}catch(e){}}
function stop(){if(timer!==null){clearTimeout(timer);timer=null}const el=document.getElementById("victoryOverlay");if(el)el.remove()}
function goTop(){try{window.scrollTo(0,0)}catch(e){}}
function home(){
 stop();currentId=null;screen="home";label();goTop();
 const daily=session("daily"),day=new Date(today()+"T00:00:00+09:00"),dayLabel=(day.getMonth()+1)+"/"+day.getDate();
 const dailyDone=daily.index===daily.ids.length;
 const card=(id,title,icon,desc)=>{const ss=session(id);const n=ss.ids.length;return '<button class="mode-card" data-act="choose" data-id="'+id+'"><b>'+icon+' '+title+'</b><span>'+desc+'</span><span style="color:#ffe19c;font-weight:850">'+(ss.index===n?"CLEAR ✓":ss.index+"/"+n+"問")+'</span></button>'};
 const levelList=levels.map(l=>{const ss=session(l.id);return '<button class="level-row" data-act="choose" data-id="'+l.id+'"><span class="level-icon">'+l.icon+'</span><span class="level-content"><b>'+l.label+' · 全'+ss.ids.length+'問</b><small>'+l.desc+'</small></span><span class="level-progress">'+(ss.index===ss.ids.length?"✓":ss.index+"/"+ss.ids.length)+'</span></button>'}).join("");
 app.innerHTML='<div class="version">LIE BREAKER · 30 SECOND DETECTIVE</div><div class="hero-title">嘘を暴く、<br><em>最高の一撃。</em></div><p class="hero-sub">短い手がかり × ひらめきの1タップ。<br>気づいた言葉をタップして、派手に粉砕。</p><section class="home-spot"><span class="mode-tag">📅 '+dayLabel+' のデイリーチャレンジ</span><div class="spot-title">今日の5問</div><p class="spot-sub">難易度ミックス。5問だけ、ひらめき勝負。</p><button class="spot-btn" data-act="choose" data-id="daily">'+(dailyDone?"もう一度挑戦 ⚡":daily.index>0?"続きをプレイ ⚡":"今日の挑戦を始める ⚡")+'</button></section><div class="home-row">'+card("sprint","5問ラッシュ","⚡","何度でも遊べる短期戦")+card("all","全問チャレンジ","🏆","やさしい→難問、36問")+'</div><section class="quality-spot"><span class="mode-tag">✨ NEW · SPECIAL PUZZLES</span><div class="spot-title" style="font-size:22px">ひらめき12問</div><p class="spot-sub" style="max-width:none">視点・順序・数字・論理。初めてのひらめきを試そう。</p><button class="spot-btn" data-act="choose" data-id="ideas">新作パックで遊ぶ →</button></section><div class="section-title">難易度を選ぶ <small>12問ずつ・いつでも変更OK</small></div><div class="level-list">'+levelList+'</div><p class="slim-footer">サーバー不要・記録はこの端末に保存</p>';
}
function choose(id){
 const c=config(id);if(!c)return;
 if(id==="sprint"){const prev=session("sprint");if(prev.index>=prev.ids.length){data.sprintNonce++;delete data.sessions.sprint}}
 const cc=config(id),ss=session(cc.id);
 if(ss.index>=ss.ids.length){const record=data.sessions[cc.id];record.index=0;record.solved=0;record.skipped=0;record.errors=0;record.streak=0;record.bestStreak=0;record.firstTry=0;record.points=0;record.bad=[];record.history=[]}
 currentId=cc.id;data.mode=currentId;store();question()
}
function question(){
 stop();const c=config(currentId),s=session(currentId);if(!c||!s){home();return}if(s.index>=s.ids.length){finish();return}
 screen="question";label();goTop();const p=indexById[s.ids[s.index]],bad=new Set(s.bad);
 const parts=p.parts.map((w,i)=>i===3?'<span class="speech-tail">'+w+'</span>':'<button class="tapword'+(bad.has(i)?" wrong":"")+'" data-act="answer" data-ans="'+i+'" type="button" '+(bad.has(i)?"disabled":"")+'>'+w+'</button>').join("");
 const badge=p.level==="expert"?"🔥 難問":p.level==="standard"?"🔎 ふつう":"🌱 やさしい";
 app.innerHTML='<div class="q-meta"><span class="n">'+badge+' · '+c.title+'</span><span>🔥 '+s.streak+' COMBO</span></div><div class="progress-track"><i style="width:'+(s.index/s.ids.length*100)+'%"></i></div><section class="caseboard"><div class="case-heading"><span class="picture">'+p.icon+'</span><span><small>CASE '+String(s.index+1).padStart(2,"0")+' / '+String(s.ids.length).padStart(2,"0")+'</small><b>'+p.title+'</b></span></div><div class="fact-label">確定した事実</div><div class="fact-line">'+p.fact+'</div><div class="person-label">🗣 '+p.who+'の証言</div><div class="speech">「'+parts+'」</div></section><div class="tap-instruction">☝ 矛盾する言葉をタップ！</div><div class="instruction-feedback" id="feedback" role="status">'+(s.bad.length?"違う！ まだ指摘できる。":"")+'</div><div class="game-footer"><span>🏅 一発正解でボーナス得点</span><button type="button" data-act="skip" class="small-link">スキップ ›</button></div>';
}
function answer(n){
 if(screen!=="question")return;const ss=session(currentId),p=indexById[ss.ids[ss.index]];
 if(n===p.a){
  screen="win";const first=ss.bad.length===0;ss.streak++;ss.bestStreak=Math.max(ss.bestStreak,ss.streak);ss.solved++;if(first)ss.firstTry++;const gain=(first?100:45)+Math.min(125,Math.max(0,ss.streak-1)*25);ss.points+=gain;ss.index++;ss.history.push(p.id);data.archive[p.id]=true;ss.bad=[];store();sound("win",ss.streak);vibrate([45,18,65]);impact(p,gain,ss.streak);
 }else{
  if(ss.bad.includes(n))return;ss.bad.push(n);ss.errors++;ss.streak=0;store();sound("wrong");vibrate(30);
  const b=app.querySelector('[data-ans="'+n+'"]');if(b){b.classList.add("wrong");b.disabled=true}
  const card=app.querySelector(".caseboard");if(card){card.classList.remove("shake");void card.offsetWidth;card.classList.add("shake")}
  const msg=document.getElementById("feedback");if(msg)msg.textContent="違う！ ほかの言葉に注目。";
  const combo=app.querySelector(".q-meta span:last-child");if(combo)combo.textContent="🔥 0 COMBO";
 }
}
function impact(p,gain,combo){
 const layer=document.createElement("div");layer.id="victoryOverlay";layer.className="impact-overlay";layer.setAttribute("role","status");layer.setAttribute("aria-label","正解："+p.why);
 let bits="";if(motion){for(let i=0;i<24;i++)bits+='<i class="impact-bit" style="--deg:'+(i*15)+'deg;--dist:'+(85+(i%5)*30)+'px;--d:'+(i%4*21)+'ms"></i>'}
 layer.innerHTML='<div class="impact-rays"></div><div class="impact-ring"></div><div class="impact-light"></div>'+bits+'<div class="impact-inner"><div class="impact-kicker">CONTRADICTION BREAK</div><div class="impact-title">矛盾、<br>粉砕ッ！</div><div class="impact-word">「'+p.parts[p.a]+'」⚡</div><p class="impact-reason">'+p.why+'</p><div class="impact-bonus">+'+gain+' PT'+(combo>=2?"　🔥 "+combo+" COMBO":"")+'</div><div class="impact-foot">タップですぐ次へ ▶</div></div>';
 layer.addEventListener("click",()=>{if(screen==="win"){stop();question()}});document.body.appendChild(layer);
 timer=setTimeout(()=>{if(screen==="win"){stop();question()}},data.pace==="read"?3500:1450);
}
function skip(){if(screen!=="question")return;const ss=session(currentId);ss.skipped++;ss.index++;ss.streak=0;ss.bad=[];store();question()}
function finish(){
 stop();screen="finish";label();goTop();const c=config(currentId),ss=session(currentId);
 const ratio=ss.ids.length?ss.firstTry/ss.ids.length:0;const grade=ratio===1?"S":ratio>=.8?"A":ratio>=.55?"B":"C";const flawless=grade==="S"&&ss.skipped===0;
 const prev=data.bests[c.id];if(!prev||ss.points>prev.points){data.bests[c.id]={points:ss.points,grade,firstTry:ss.firstTry,date:today()};store()}
 app.innerHTML='<div class="result-main"><div class="version">'+c.icon+' '+c.title+' COMPLETE</div><div class="result-seal">'+(flawless?"🏆":"🎖️")+'</div><div class="result-grade">RANK '+grade+'</div><h1 class="result-hero">'+(flawless?"パーフェクト！":"捜査完了！")+'</h1><p class="result-sub">いい推理だった。もう1ラウンドいこう。</p><div class="score-panels"><div class="score-panel"><b>'+ss.points+'</b><small>スコア</small></div><div class="score-panel"><b>'+ss.firstTry+'/'+ss.ids.length+'</b><small>一発正解</small></div><div class="score-panel"><b>'+ss.bestStreak+'</b><small>最大コンボ</small></div></div></div><button class="fill-btn" data-act="replay">同じコースをもう一度 ⚡</button><button class="fill-btn secondary" data-act="home">ほかのコースへ</button><button class="fill-btn secondary" data-act="archive">解いた事件の図鑑を見る</button><p class="slim-footer">最高記録は端末に保存。次はもっと速く、気持ちよく。</p>';
}
function replay(){
 if(!currentId){home();return}let c=config(currentId);if(currentId==="sprint"){data.sprintNonce++;delete data.sessions.sprint;c=config(currentId)}else delete data.sessions[c.id];store();choose(c.id)
}
function archive(){
 stop();screen="archive";label();goTop();const count=Object.keys(data.archive).length;
 const sect=levels.map(l=>{const content=l.items.map((p,i)=>data.archive[p.id]?'<details class="archive-card"><summary><span class="id">'+String(i+1).padStart(2,"0")+'</span>'+p.icon+' '+p.title+'<span class="arrow">⌄</span></summary><div class="archive-detail"><b>証拠：</b>'+p.fact+'<br><b>指摘：</b>'+p.parts[p.a]+'<br><b>真相：</b>'+p.why+'</div></details>':'<div class="archive-locked">🔒 '+String(i+1).padStart(2,"0")+'　未解決の事件</div>').join("");return '<h3 class="archive-level">'+l.icon+' '+l.label+'</h3>'+content}).join("");
 app.innerHTML='<div class="archive-head"><div><div class="version">EVIDENCE ARCHIVE</div><h1 style="font-size:26px;margin:10px 0 0">解決した事件</h1></div><b style="font-size:19px;color:#ffe29c">'+count+'/36</b></div><p style="color:#b7cbd0;font-size:12px">解いた謎の理由をいつでも読み返せる。</p>'+sect+'<button class="fill-btn secondary" data-act="home">コース選択へ戻る</button>';
}
app.addEventListener("click",e=>{const b=e.target.closest("button[data-act]");if(!b||b.disabled)return;switch(b.dataset.act){case "choose":choose(b.dataset.id);break;case "answer":answer(Number(b.dataset.ans));break;case "skip":skip();break;case "home":home();break;case "archive":archive();break;case "replay":replay();break;}});
soundButton.addEventListener("click",()=>{data.sound=!data.sound;store();label();if(data.sound)sound("tap")});
archiveButton.addEventListener("click",archive);
const paceButton=document.getElementById("paceBtn");paceButton.addEventListener("click",()=>{data.pace=data.pace==="fast"?"read":"fast";paceButton.textContent=data.pace==="fast"?"⚡高速":"📖解説";store();});
paceButton.textContent=data.pace==="fast"?"⚡高速":"📖解説";
document.addEventListener("visibilitychange",()=>{if(document.hidden&&screen==="win"){stop();question()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&screen==="archive")home()});
home();
})();
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}</script></body></html>
