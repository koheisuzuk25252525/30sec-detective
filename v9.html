<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1523"><meta name="description" content="30秒探偵 ディープ推理試験版。5つの手がかりから1つの真相を導け。"><title>30秒探偵 v9 — 深読み推理5事件</title><style>
:root{color-scheme:dark;--bg:#0c1523;--surface:#173049;--ink:#f3f2eb;--muted:#b0c6d1;--gold:#ffdd98;--mint:#8bf3d2;--red:#ff9f94}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -22%,#2e4d63,#0c1728 62%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid var(--mint);outline-offset:3px}button:disabled{cursor:default;opacity:.55}
.shell{max-width:460px;margin:0 auto;min-height:100svh;display:flex;flex-direction:column;padding:13px 16px max(25px,env(safe-area-inset-bottom))}
header{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:0 0 12px;border-bottom:1px solid #46637b80}.brand{font-size:16px;font-weight:1000;letter-spacing:-.06em}.brand b{color:var(--mint)}.tools{display:flex;gap:6px;align-items:center}.small{border:1px solid #54738a;background:#1a344b;border-radius:24px;padding:7px 9px;color:#ddf1ec;font-size:11px;font-weight:800;min-height:35px}
main{flex:1;padding:16px 0 0}.kicker{color:var(--mint);font-size:11px;font-weight:900;letter-spacing:.15em}.hero{font-size:clamp(42px,11.5vw,57px);font-weight:1000;line-height:1.12;letter-spacing:-.07em;margin:16px 0}.hero em{color:var(--gold);font-style:normal}.lead{font-size:15px;line-height:1.7;color:#d0e2e6}
.introboard{margin:20px 0 16px;position:relative;overflow:hidden;background:linear-gradient(130deg,#26435a,#142a41);border:1px solid #719397;border-radius:18px;padding:22px 17px}.introboard .lens{font-size:85px;text-align:center;line-height:1.7;filter:drop-shadow(0 0 23px #8bf3d2aa)}.introboard .caption{font-size:14px;text-align:center;color:#edeeea;font-weight:850}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.pill{border:1px solid #5c7f8e;border-radius:30px;color:#bddbd9;padding:5px 9px;font-size:11px}
.primary{border:0;background:linear-gradient(105deg,#ffecb2,#ffc47a);color:#1c3140;font-size:17px;font-weight:1000;padding:16px 13px;border-radius:14px;box-shadow:0 5px 0 #a36c39;width:100%;min-height:53px}.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #a36c39}.subtle{font-size:12px;border:1px solid #54778e;background:#20384c;border-radius:12px;color:#d5e9eb;padding:11px;min-height:42px}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.qindex{font-size:12px;color:#9fe8d1;font-weight:950}.streak{color:#ffdf9a;border:1px solid #7e6a4b;background:#2b2e32;padding:5px 9px;border-radius:24px;font-size:11px;font-weight:900}
.progress{height:5px;border-radius:5px;background:#324757;margin:12px 0 15px;overflow:hidden}.progress i{display:block;background:linear-gradient(90deg,#77e3bd,#ffcf7c);height:100%;transition:width .3s}
.board{border:1px solid #5e8197;background:linear-gradient(150deg,#1b3a55,#142b42);border-radius:17px;padding:16px 14px 14px;box-shadow:0 12px 32px #0005}
.scene-head{display:flex;gap:12px;align-items:center;padding-bottom:10px;border-bottom:1px solid #527089}.scene-head .emoji{font-size:39px}.scene-head h1{font-size:23px;line-height:1.3;letter-spacing:-.04em;margin:2px 0}.eyebrow{font-size:10px;font-weight:900;color:#a8e6d6;letter-spacing:.1em}
.setup{font-size:13px;color:#d5e5e7;line-height:1.7;padding:12px 1px 0;font-weight:750}
.clues{margin-top:10px;display:grid;gap:6px}.clue{display:flex;align-items:baseline;gap:8px;padding:9px 10px;border:1px solid #476680;border-radius:9px;background:#102941}.clue .no{flex:none;color:#94efdc;font-size:10px;font-weight:950;letter-spacing:.04em}.clue .info{font-size:12px;font-weight:700;line-height:1.5;color:#ecf2ef}
.ask{margin:19px 0 11px;text-align:center;font-size:17px;font-weight:950;color:#ffe2aa;line-height:1.4}
.options{display:grid;grid-template-columns:1fr 1fr;gap:9px}.option{border:1px solid #5a7d98;border-bottom:4px solid #335776;background:#264963;color:#f6f5eb;border-radius:12px;min-height:57px;padding:12px 6px;font-size:17px;font-weight:900}.option:active{transform:translateY(2px);border-bottom-width:2px}.option.incorrect{color:#ffdad5;background:#603a45;border-color:#e9928a;text-decoration:line-through}
.feedback{min-height:22px;margin:8px 0;text-align:center;color:#ffbda7;font-size:12px;font-weight:850}.footer{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:5px}.footer .hint{color:#bfece2;background:none;border:1px solid #5b8685;border-radius:24px;font-size:11px;padding:9px 11px}.footer .skip{border:0;background:none;color:#a5bdc5;text-decoration:underline;font-size:11px;padding:9px 7px}.hintbox{border:1px solid #678d8f;border-radius:10px;background:#1c393b;color:#d1efe5;font-size:12px;line-height:1.6;padding:10px;margin:8px 0}.tip{font-size:11px;color:#9bb3c2;text-align:center;margin:13px 0}
.overlay{position:fixed;inset:0;z-index:30;background:radial-gradient(circle,#63402a,#121d30 60%);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:18px;text-align:center;isolation:isolate;animation:quake .4s ease-out}.flash{inset:0;position:absolute;background:#fff0bd;animation:flash .7s forwards}.ring{position:absolute;width:170px;height:170px;border:9px solid #ffefb1;border-radius:50%;animation:ring .8s ease-out both;box-shadow:0 0 60px #f9ad4d}.shards{position:absolute;inset:-60%;background:repeating-conic-gradient(from 5deg,transparent 0 11deg,#ffe3aa2a 12deg 15deg,transparent 16deg 23deg);animation:rotate .8s ease-out both}.wincontent{z-index:3;position:relative;animation:punch .35s cubic-bezier(.1,1.5,.4,1) both}.winlabel{font-size:11px;color:#9af9df;font-weight:950;letter-spacing:.25em}.wintitle{font-size:clamp(54px,15vw,74px);line-height:1.1;font-weight:1000;letter-spacing:-.06em;text-shadow:0 7px 0 #a75327,0 0 33px #fcb34a;color:#ffe294;margin:13px 0}.reveal{font-size:17px;font-weight:900;line-height:1.6;color:#fff}.explain{font-size:12px;line-height:1.65;color:#e9f2e7;max-width:350px;margin:12px auto 0}.combo{font-size:18px;font-weight:950;color:#96ffd4;margin-top:12px}
@keyframes quake{0%{transform:scale(.97)}20%{transform:translate(8px,-8px)}40%{transform:translate(-7px,5px)}60%,100%{transform:none}}@keyframes flash{0%{opacity:1}30%{opacity:.4}100%{opacity:0}}@keyframes ring{from{opacity:1;transform:scale(.2)}to{opacity:0;transform:scale(5)}}@keyframes rotate{to{transform:rotate(80deg)}}@keyframes punch{from{transform:scale(2);opacity:0}to{transform:scale(1);opacity:1}}
.result{text-align:center;padding:30px 2px}.result h1{font-size:30px;letter-spacing:-.06em}.medal{font-size:81px}.result-stats{display:flex;gap:9px;margin:19px 0}.result-stats div{flex:1;background:#173249;border:1px solid #4e6b80;border-radius:12px;padding:12px 4px}.result-stats b{display:block;color:#ffdd93;font-size:24px}.result-stats small{font-size:10px;color:#c0d7da}
.review{border:1px solid #466a81;border-radius:10px;background:#142c41;margin:7px 0;text-align:left;padding:0}.review summary{padding:12px;color:#c5eee0;font-size:13px;font-weight:850;cursor:pointer}.review p{padding:0 12px 12px;color:#dcecf0;font-size:12px;line-height:1.7}.review h3{font-size:11px;color:#ffdd93;margin:0;padding:9px 12px}.result .primary{margin-top:18px}
@media(max-height:730px){main{padding-top:9px}.board{padding:11px}.scene-head h1{font-size:20px}.clue{padding:7px}.clue .info{font-size:11px}.setup{padding-top:8px;font-size:12px}.ask{margin:12px 0 7px}.option{min-height:48px;padding:10px 5px;font-size:15px}.footer{margin-top:0}}
@media(prefers-reduced-motion:reduce){.overlay,.flash,.ring,.shards,.wincontent{animation:none!important}.flash,.ring,.shards{display:none}}
</style></head><body><div class="shell"><header><span class="brand">⌕ <b>30秒</b>探偵 <small style="font-size:9px;color:#b2c4cc">DEEP</small></span><div class="tools"><button class="small" type="button" id="paceBtn">⚡ 高速</button><button class="small" type="button" id="soundBtn">♪ ON</button></div></header><main id="app"></main></div><script>
(()=>{
"use strict";
const puzzles=[{"id":"logic-01","title":"4通の配達記録","icon":"📦","kind":"順序推理","tag":"ウォーミングアップ","lead":"4人の配達員が、1人ずつ順番に到着した。2番目は誰？","clues":["BはCより先に到着した","CはAより先に到着した","DはBのすぐ後に到着した","Aは最後に到着した"],"question":"2番目に着いたのは？","options":["A","B","C","D"],"answer":3,"hint":"BとDは必ず隣り合う。Aは最後。残るCの位置に注目。","explain":"B→D→C→Aの順番しか成立しない。2番目はD！","logic":"B<D<C<A かつ D=Bの直後、A=4番目 → BDCA"},{"id":"logic-02","title":"金庫の暗証番号","icon":"🔐","kind":"暗号推理","tag":"推理が本格化","lead":"金庫の番号は重複しない3桁。試した履歴から正解を導け。","clues":["682：1個正しく、位置も正しい","614：1個正しいが、位置が違う","206：2個正しいが、両方位置が違う","738：正しい数字は0個","780：1個正しいが、位置が違う"],"question":"金庫を開ける3桁の番号は？","options":["042","062","012","024"],"answer":0,"hint":"738から7・3・8は使わない。780の正しい数字は0。","explain":"738で7・3・8を除外。780から0を含む。206と614・682を照合すると、番号は042！","logic":"0,4,2"},{"id":"logic-03","title":"真実はひとつ","icon":"🕵️","kind":"証言推理","tag":"4人の証言","lead":"犯人はA・B・C・Dの1人。4人の証言のうち、本当は1つだけ。","clues":["A「犯人はBかCだ」","B「犯人はCかDだ」","C「犯人はAだ」","D「犯人はDではない」"],"question":"犯人は誰？","options":["A","B","C","D"],"answer":3,"hint":"Aが犯人なら本当は2つ、Bなら2つ、Cなら3つ。","explain":"Dが犯人なら、Bの証言だけが本当になる。他の3人が犯人だと、本当の証言が2つ以上ある！","logic":"truth counts A=2,B=2,C=3,D=1"},{"id":"logic-04","title":"偽物のコイン袋","icon":"⚖️","kind":"計量推理","tag":"差の意味","lead":"A・B・C袋の1つだけ、全コインが偽物。はかりで一度だけ判定した。","clues":["どの袋にもコインは10枚ずつ","本物は1枚5g、偽物は1枚3g","Aから1枚、Bから2枚、Cから3枚を取り出した","取り出した6枚の重さは合計24g"],"question":"偽物のコインが入った袋は？","options":["A袋","B袋","C袋","判定できない"],"answer":2,"hint":"全部本物なら30g。減った6gは、偽物が1枚あたり2g軽いから。","explain":"全部本物なら30g。実際は6g軽い＝偽物が3枚。3枚取ったC袋が偽物！","logic":"6g deficit / 2g per fake coin = 3 => C"},{"id":"logic-05","title":"19分の空白","icon":"🕰️","kind":"アリバイ推理","tag":"時刻補正","lead":"展示品が消えた瞬間、展示室にいた人物は誰？ すべて同じ日の記録だ。","clues":["盗難センサー：21:23（時計が4分進んでいる）","Aの在室：21:17〜21:21（時計が3分進む）","Bの在室：21:16〜21:22（時計が2分遅れる）","Cの在室：21:20〜21:26（時計は正確）"],"question":"盗難の瞬間、室内にいたのは？","options":["Aのみ","Bのみ","Cのみ","BとC"],"answer":1,"hint":"センサーの実時刻は21:19。全員の在室時刻も補正して比較。","explain":"実際の盗難は21:19。Aは21:14〜18、Bは21:18〜24、Cは21:20〜26。21:19にいたのはBだけ！","logic":"sensor19; A14-18; B18-24; C20-26 => B"}];
const app=document.getElementById("app"),soundBtn=document.getElementById("soundBtn"),paceBtn=document.getElementById("paceBtn");
const key="detective_v9_deep_trial";
let saved={};try{saved=JSON.parse(localStorage.getItem(key)||"{}")||{}}catch(e){}
let index=Math.min(puzzles.length,Math.max(0,saved.index||0)),mistakes=saved.mistakes||0,firsts=saved.firsts||0,combo=saved.combo||0,best=saved.best||0,hints=saved.hints||0,soundOn=saved.sound!==false,slow=saved.slow===true,usedHint=false,wrong=new Set(),screen="home",timer=null,audio=null;
function persist(){try{localStorage.setItem(key,JSON.stringify({index,mistakes,firsts,combo,best,hints,sound:soundOn,slow}))}catch(e){}}
function headers(){soundBtn.textContent=soundOn?"♪ ON":"♪ OFF";paceBtn.textContent=slow?"📖 解説":"⚡ 高速"}
function play(kind){if(!soundOn)return;try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume();const tone=(hz,t,dur,vol,type,fall)=>{const st=audio.currentTime+t,o=audio.createOscillator(),g=audio.createGain();o.type=type||"sine";o.frequency.setValueAtTime(hz,st);if(fall)o.frequency.exponentialRampToValueAtTime(fall,st+dur);g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(vol,st+.01);g.gain.exponentialRampToValueAtTime(.0001,st+dur);o.connect(g);g.connect(audio.destination);o.start(st);o.stop(st+dur+.02)};if(kind==="win"){tone(95,0,.27,.13,"sawtooth",38);tone(240,0,.14,.065,"square",75);tone(610,.11,.15,.08,"triangle");tone(900,.23,.2,.09);tone(1230,.38,.2,.09,"sine")}else if(kind==="wrong"){tone(170,0,.13,.07);tone(130,.12,.18,.07)}else tone(700,0,.08,.04)}catch(e){}}
function vibrate(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function cancel(){if(timer!==null){clearTimeout(timer);timer=null}let e=document.getElementById("winning");if(e)e.remove()}
function start(){cancel();screen="home";headers();app.innerHTML='<div class="kicker">LIE BREAKER · DEEP DEDUCTION TRIAL</div><h1 class="hero">探すだけじゃ、<br><em>終わらない。</em></h1><p class="lead">答えは文章に書いていない。<br>限られた手がかりから、真相を導け。</p><section class="introboard"><div class="lens">🧠⚡</div><div class="caption">1事件 × 本格推理 × 真相への一撃</div></section><div class="pills"><span class="pill">全5事件</span><span class="pill">時間制限なし</span><span class="pill">ヒントあり</span><span class="pill">本当に考える謎</span></div><button class="primary" data-act="go">'+(index===0?"難事件に挑戦する ⚡":index===puzzles.length?"結果を見る →":"続きから挑戦 ⚡")+'</button>'+(index>0?'<button class="subtle" style="width:100%;margin-top:14px" data-act="reset">初めから遊び直す</button>':'')+'<p class="tip">以前の1タップ矛盾探しとは、ルールを変えた試験版です。</p>'}
function question(){
 cancel();if(index>=puzzles.length){finish();return}
 screen="question";headers();const p=puzzles[index],clueHTML=p.clues.map((c,i)=>'<div class="clue"><span class="no">'+String(i+1).padStart(2,"0")+'</span><span class="info">'+c+'</span></div>').join("");
 const answers=p.options.map((op,i)=>'<button type="button" class="option'+(wrong.has(i)?" incorrect":"")+'" data-act="answer" data-i="'+i+'" '+(wrong.has(i)?"disabled":"")+'>'+op+'</button>').join("");
 app.innerHTML='<div class="qhead"><span class="qindex">CASE '+String(index+1).padStart(2,"0")+' / 05 · '+p.kind+'</span><span class="streak">🔥 '+combo+' COMBO</span></div><div class="progress"><i style="width:'+(index/puzzles.length*100)+'%"></i></div><section class="board"><div class="scene-head"><span class="emoji">'+p.icon+'</span><div><div class="eyebrow">'+p.tag+'</div><h1>'+p.title+'</h1></div></div><div class="setup">'+p.lead+'</div><div class="clues">'+clueHTML+'</div></section><div class="ask">'+p.question+'</div><div class="options">'+answers+'</div><div id="feedback" class="feedback" role="status"></div>'+(usedHint?'<div class="hintbox">💡 '+p.hint+'</div>':'')+'<div class="footer"><button type="button" class="hint" data-act="hint" '+(usedHint?"disabled":"")+'>💡 ヒント（得点半減）</button><button type="button" class="skip" data-act="skip">スキップ ›</button></div>';
}
function answer(n){
 if(screen!=="question")return;
 const p=puzzles[index];
 if(n===p.answer){
  screen="win";const perfect=wrong.size===0&&!usedHint;if(perfect){firsts++;combo++;best=Math.max(best,combo)}else combo=0;
  index++;persist();play("win");vibrate([40,30,65,22,75]);win(p,perfect);
 }else{if(wrong.has(n))return;wrong.add(n);mistakes++;combo=0;persist();play("wrong");vibrate(50);const b=app.querySelector('[data-i="'+n+'"]');if(b){b.classList.add("incorrect");b.disabled=true}document.getElementById("feedback").textContent="その推理では条件が合わない。もう一度！";const badge=app.querySelector(".streak");if(badge)badge.textContent="🔥 0 COMBO"}
}
function win(p,perfect){const layer=document.createElement("div");layer.className="overlay";layer.id="winning";layer.setAttribute("role","alert");layer.innerHTML='<div class="shards"></div><div class="ring"></div><div class="flash"></div><div class="wincontent"><div class="winlabel">CASE SOLVED!</div><div class="wintitle">真相、<br>解明ッ！</div><div class="reveal">正解：'+p.options[p.answer]+'</div><div class="explain">'+p.explain+'</div>'+(perfect?'<div class="combo">⚡ 一撃正解！ '+combo+' COMBO</div>':'')+'<p style="font-size:11px;color:#bdd8d1;margin-top:15px">タップで次へ ▶</p></div>';layer.addEventListener("click",next);document.body.appendChild(layer);timer=setTimeout(next,slow?6500:2700)}
function next(){if(screen!=="win")return;cancel();wrong=new Set();usedHint=false;question()}
function showHint(){if(screen!=="question"||usedHint)return;usedHint=true;hints++;combo=0;persist();question()}
function skip(){if(screen!=="question")return;index++;combo=0;wrong=new Set();usedHint=false;persist();question()}
function reset(){index=0;mistakes=0;firsts=0;combo=0;best=0;hints=0;wrong=new Set();usedHint=false;persist();question()}
function finish(){cancel();screen="finish";headers();const review=puzzles.map((p,i)=>'<details class="review"><summary>'+p.icon+' '+String(i+1).padStart(2,"0")+'　'+p.title+'</summary><h3>正解：'+p.options[p.answer]+'</h3><p>'+p.explain+'</p></details>').join("");app.innerHTML='<div class="result"><div class="kicker">ALL CASES CLEARED</div><div class="medal">'+(firsts===5?"🏆":"🎖️")+'</div><h1>本物の推理が、始まった。</h1><p class="lead" style="font-size:13px">答えを探すのではなく、導く。<br>この手応えをもっと磨いていこう。</p><div class="result-stats"><div><b>'+firsts+'/5</b><small>一撃正解</small></div><div><b>'+best+'</b><small>最高コンボ</small></div><div><b>'+hints+'</b><small>ヒント使用</small></div></div><button class="primary" data-act="reset">5事件をもう一度 ⚡</button><h2 style="font-size:16px;margin:25px 0 10px;text-align:left">解決の記録</h2>'+review+'</div>'}
app.addEventListener("click",e=>{const b=e.target.closest("button[data-act]");if(!b||b.disabled)return;switch(b.dataset.act){case "go":question();break;case "answer":answer(Number(b.dataset.i));break;case "hint":showHint();break;case "skip":skip();break;case "reset":reset();break;}});
soundBtn.addEventListener("click",()=>{soundOn=!soundOn;persist();headers();if(soundOn)play("tap")});
paceBtn.addEventListener("click",()=>{slow=!slow;persist();headers()});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&screen==="win"){cancel();next()}});
start();
})();
</script></body></html>
