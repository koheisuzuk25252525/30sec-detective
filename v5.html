<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1729">
<title>30秒探偵 v5 | 一文推理 改訂版</title>
<style>
:root{color-scheme:dark;--bg:#0b1628;--panel:#152b42;--line:#3e617b;--cream:#f2f5f2;--muted:#adc2d3;--gold:#ffdc83;--mint:#87f5d0;--red:#ff9b92}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% -20%,#29445f,var(--bg) 64%);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:var(--cream);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}button:focus-visible{outline:3px solid var(--mint);outline-offset:3px}button:disabled{cursor:default;opacity:.6}
.shell{max-width:440px;min-height:100svh;margin:0 auto;padding:12px 16px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;position:relative}
header{display:flex;justify-content:space-between;align-items:center;gap:9px;padding:6px 0 14px}.brand{font-size:16px;font-weight:950;letter-spacing:-.04em;white-space:nowrap}.brand b{color:var(--mint)}.tools{display:flex;gap:7px;align-items:center}.ghost{border:1px solid #52718a;border-radius:25px;padding:7px 10px;background:#172c43;color:#d5e6eb;font-size:11px;font-weight:750}
#app{flex:1}.kicker{font-size:11px;font-weight:850;color:var(--mint);letter-spacing:.15em}.hero{font-size:clamp(41px,12vw,57px);line-height:1.13;letter-spacing:-.075em;font-weight:950;margin:20px 0}.hero em{font-style:normal;color:var(--gold)}.intro{color:#d4e0e4;font-size:15px;line-height:1.8}.hero-icon{height:168px;display:flex;align-items:center;justify-content:center;font-size:96px;filter:drop-shadow(0 0 25px #75f5dd58)}.pillrow{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 22px}.pill{font-size:11px;border:1px solid #466f82;color:#c9e6e8;padding:5px 8px;border-radius:20px}
.cta{display:block;width:100%;border:0;border-radius:15px;background:linear-gradient(110deg,#ffe4a1,#f9ba71);box-shadow:0 6px 0 #a46b39;color:#14233a;padding:16px;font-weight:950;font-size:17px;margin-top:16px;min-height:55px}.cta:active{transform:translateY(4px);box-shadow:0 2px 0 #a46b39}.secondary{display:block;width:100%;padding:13px;border-radius:13px;border:1px solid #56718c;background:#1d3349;color:#dfecf3;margin-top:10px;font-weight:750}
.tiny{color:#aabec8;font-size:11px;text-align:center;margin-top:14px;line-height:1.6}.meter{height:5px;background:#294156;overflow:hidden;border-radius:12px;margin:7px 0 16px}.meter i{display:block;height:100%;background:linear-gradient(90deg,#72e4bb,#f9d17d);transition:width .25s}
.qtop{display:flex;align-items:center;justify-content:space-between}.qnum{font-size:12px;font-weight:900;color:#b7e8dc}.streak{font-size:12px;font-weight:900;color:#ffda89;border:1px solid #866d46;border-radius:25px;padding:5px 10px}
.scene{border-radius:16px;border:1px solid #4e6d84;background:linear-gradient(145deg,#1f3b54,#102539);padding:15px 15px 13px;box-shadow:0 13px 30px #02091148}.scene-head{display:flex;align-items:center;gap:11px}.scene-icon{font-size:42px;line-height:1}.scene h1{font-size:24px;line-height:1.35;letter-spacing:-.04em;margin:0}.scene .tag{font-size:10px;color:#9edaca;font-weight:850;letter-spacing:.09em}.clues{display:grid;gap:7px;margin-top:14px}.clue{background:#0e2436;border:1px solid #3a5b6f;border-radius:10px;padding:10px 11px;display:flex;gap:8px;align-items:flex-start}.clue .number{flex:none;background:#2d5263;color:#aef4dc;border-radius:6px;padding:2px 5px;font-size:10px;font-weight:900}.clue .line{font-size:13px;line-height:1.6;color:#e3eef0;font-weight:650}
.quote{margin:14px 0 8px;padding:14px;background:#253e59;border-radius:13px;position:relative}.quote::before{content:"“";position:absolute;top:-14px;left:9px;color:#84e1c7;font-size:40px}.speaker{font-size:11px;color:#b5dbd7;margin:0 0 5px;font-weight:850}.quote-text{font-size:15px;font-weight:760;line-height:1.6}
.ask{font-weight:900;font-size:15px;margin:15px 0 10px;display:flex;align-items:center;gap:6px}.ask i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mint)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.answer{background:#24425e;border:1px solid #51708b;border-bottom:4px solid #395675;border-radius:12px;padding:12px 8px;min-height:58px;font-size:14px;font-weight:900;color:#f5f9f8;line-height:1.45}.answer:active{transform:translateY(3px);border-bottom-width:1px}.answer.wrong{background:#663c49;border-color:#ff999a}.feedback{min-height:52px;margin:12px 0 0;color:#ffb6a7;font-size:12px;line-height:1.5;font-weight:700}.feedback:empty{min-height:30px}
.bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:10px}.bottom small{font-size:10px;color:#a3b9c5}.skip{border:0;background:transparent;text-decoration:underline;color:#b7c8d1;padding:8px;font-size:11px}
.shake{animation:shake .3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:#0b1629e8;overflow:hidden;text-align:center;padding:24px}.flash{position:absolute;inset:0;background:white;animation:flash .7s forwards}.ring{position:absolute;border:6px solid #ffda8c;border-radius:50%;height:240px;width:240px;animation:ring .9s ease-out both;box-shadow:0 0 100px #ffb453}.burst-bg{position:absolute;inset:-50%;background:conic-gradient(transparent 0deg,#ffe08e22 8deg,transparent 15deg,#ffffff20 25deg,transparent 40deg);animation:spin .9s linear both}.wincontent{position:relative;z-index:3;animation:punch .35s cubic-bezier(.15,1.5,.4,1) both}.winlabel{font-size:13px;font-weight:950;letter-spacing:.25em;color:var(--mint)}.wintitle{font-size:clamp(55px,14vw,80px);line-height:1.1;font-weight:1000;color:var(--gold);text-shadow:0 7px 0 #944a26,0 0 34px #ef9f49;letter-spacing:-.07em;margin:14px 0}.explain{font-weight:800;color:#f5f9fa;line-height:1.7;font-size:15px;max-width:340px;margin:auto}.nextcount{font-size:11px;color:#a8d5cf;margin-top:24px}
@keyframes punch{from{transform:scale(2.2) rotate(-7deg);opacity:.1}to{transform:scale(1) rotate(0);opacity:1}}@keyframes ring{from{transform:scale(.3);opacity:1}to{transform:scale(4);opacity:0}}@keyframes flash{0%{opacity:1}25%{opacity:.25}100%{opacity:0}}@keyframes spin{to{transform:rotate(100deg)}}
.result{text-align:center;padding-top:19px}.trophy{font-size:85px;margin:22px 0 12px}.result h1{font-size:34px;letter-spacing:-.055em;margin:10px 0}.result .value{color:var(--mint);font-size:42px;font-weight:950}.statrow{display:flex;gap:8px;margin:25px 0}.stat{flex:1;border:1px solid #476981;border-radius:12px;background:#193049;padding:15px 4px}.stat b{font-size:25px;color:var(--gold);display:block}.stat small{font-size:10px;color:#b1c7d2}
@media(max-height:720px){.shell{padding-top:4px}.scene{padding:11px}.scene h1{font-size:22px}.clue{padding:8px}.quote{margin:8px 0;padding:10px}.answer{min-height:51px}.feedback{margin-top:7px;min-height:20px}.meter{margin:4px 0 8px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}.flash,.ring,.burst-bg{display:none}}

/* v5 simplified: one compact card, tap directly on the spoken words */
.v5-card{background:linear-gradient(150deg,#1d3852,#152941);border:1px solid #58768c;border-radius:19px;padding:18px 16px;box-shadow:0 15px 45px #0005;margin:12px 0 12px}
.v5-title{display:flex;align-items:center;gap:10px;border-bottom:1px solid #48647c;padding-bottom:15px}
.v5-title span{font-size:42px;line-height:1}.v5-title b{font-size:23px;line-height:1.3;letter-spacing:-.03em}
.v5-situation{font-size:16px;font-weight:750;line-height:1.75;color:#e9f2f1;padding:20px 2px}
.v5-speaker{color:#8ce9c9;font-size:12px;font-weight:900;letter-spacing:.03em;margin:4px 0 13px}
.v5-quote{font-size:20px;font-weight:800;line-height:2.55;color:#f6f7f6}
.v5-word{display:inline;color:#fff1d3;border:0;border-bottom:2px dashed #b7caa8;padding:4px 2px;margin:0 1px;min-height:42px;background:#36516b;border-radius:6px 6px 2px 2px;font-size:19px;line-height:1.6;font-weight:850;vertical-align:baseline;letter-spacing:-.03em}
.v5-word:active{transform:scale(.95);background:#517894}.v5-word.wrong{background:#6c3540;color:#ffe8e8;text-decoration:line-through}.v5-word:disabled{opacity:.6}
.v5-prompt{text-align:center;font-size:15px;font-weight:950;color:#95f0d1;margin:19px 0 9px}
.v5-feedback{min-height:33px;font-size:13px;color:#ffada4;font-weight:850;text-align:center}.v5-win .explain{max-width:305px}.v5-win .wintitle{margin:8px 0}.v5-win .nextcount{margin-top:13px}
@media(max-height:740px){.v5-card{padding:13px}.v5-situation{padding:13px 2px}.v5-quote{font-size:18px;line-height:2.15}.v5-word{font-size:17px;min-height:40px}.v5-prompt{margin-top:12px}}

.v5-fact{color:#96eccf;font-size:11px;font-weight:900;margin-top:15px;letter-spacing:.04em}
.v5-situation{padding:5px 2px 14px;font-size:16px;line-height:1.6}
.v5-plain{font-size:19px;line-height:1.6;color:#f8f4ed;display:inline;padding:4px 2px}
@media(max-height:740px){.v5-fact{margin-top:9px}.v5-situation{padding-bottom:10px}.v5-plain{font-size:17px}}
</style>
</head>
<body>
<div class="shell"><header><span class="brand">⌕ <b>30秒</b>探偵</span><div class="tools"><span class="ghost" id="bestLabel">BEST 0</span><button type="button" class="ghost" id="sound">♪ ON</button></div></header><main id="app"></main></div>
<script>
(function(){
"use strict";
var puzzles=[{"title":"消えた終電","icon":"🚉","who":"乗客","scene":"昨日の青葉駅。終電は23:14で、その後の列車はゼロ。","parts":["昨日、","青葉駅から","23:26発の","電車で帰った。"],"a":2,"why":"青葉駅の終電は23:14。23:26発の列車はない！"},{"title":"赤いコート","icon":"📹","who":"警備員","scene":"23時の監視映像。人物と服の形は見えるが、白黒で色は不明。","parts":["23時の","監視映像で","赤いコートを","見た。"],"a":2,"why":"服は映っていても、白黒映像だけでは赤いと分からない！"},{"title":"閉ざされた西門","icon":"🚧","who":"来場者","scene":"6月5日の受付記録に本人の名前。東門は開放、西門は閉鎖中。","parts":["6月5日に","西門から","受付へ","行った。"],"a":1,"why":"受付に来たのは事実。でも閉鎖中の西門からは入れない！"},{"title":"封印された箱","icon":"📦","who":"検査員","scene":"14:35、A-17の箱をX線検査。封印は検査後も無傷。","parts":["14:35に","A-17の箱を","開封して","検査した。"],"a":2,"why":"X線検査はしたが、封印は無傷。箱を開けたという部分が嘘！"},{"title":"誰のスマホ？","icon":"📱","who":"関係者","scene":"18:10に兄との通話記録あり。使用端末はタブレット。スマホは電源OFF。","parts":["18:10に","スマホで","兄と","話した。"],"a":1,"why":"通話自体は事実。でも使ったのはスマホではなくタブレット！"},{"title":"存在しない日","icon":"📅","who":"秘書","scene":"2025年、社長との会議は2月28日に記録。2月は28日まで。","parts":["2025年の","2月29日に","社長と","会議した。"],"a":1,"why":"2025年は平年。2月29日は存在しない！"},{"title":"おつりの嘘","icon":"💴","who":"買い物客","scene":"購入額2,600円。5,000円札で支払い、店員がおつりを渡した。","parts":["5,000円を払い","2,600円の品を買い","3,400円の","おつりを受け取った。"],"a":2,"why":"正しいおつりは2,400円。3,400円では1,000円多い！"},{"title":"未来のフィルム","icon":"📷","who":"写真家","scene":"フィルムF-24の発売は2024年。撮影機材はそれ以前には存在しない。","parts":["2022年に","F-24を使って","友人の写真を","撮った。"],"a":0,"why":"F-24が発売されたのは2024年。2022年に使うことはできない！"},{"title":"休館日の返却","icon":"📚","who":"利用者","scene":"4月4日は終日休館。司書は全員不在、屋外返却ポストのみ利用可。","parts":["4月4日に","返却ポストの前で","司書に直接","本を渡した。"],"a":2,"why":"司書が全員不在の日。返却ポストは使えても、直接渡せない！"},{"title":"封鎖された出口","icon":"🚘","who":"運転手","scene":"21:17、車両の出庫記録あり。東出口は開放、西出口は21:05から閉鎖。","parts":["21:17に","西出口から","車で","帰った。"],"a":1,"why":"出庫はしている。でもその時刻、西出口は閉鎖中だ！"}];
var contexts=puzzles.map(function(p){return p.scene});
var app=document.getElementById("app"),soundBtn=document.getElementById("sound"),bestLabel=document.getElementById("bestLabel");
var key="detective_v5_unambiguous_20261023",saved={};try{saved=JSON.parse(localStorage.getItem(key)||"{}")||{}}catch(e){}
var index=Math.min(10,Math.max(0,Number(saved.index)||0)),streak=Number(saved.streak)||0,best=Number(saved.best)||0,score=Number(saved.score)||0,misses=Number(saved.misses)||0,soundOn=saved.sound!==false;
var locked=false,overlayTimer=null,mode="start",audio=null,wrongChoices={};
function persist(){try{localStorage.setItem(key,JSON.stringify({index:index,streak:streak,best:best,score:score,misses:misses,sound:soundOn}))}catch(e){}}
function hdr(){bestLabel.textContent="BEST "+best;soundBtn.textContent=soundOn?"♪ ON":"♪ OFF"}
function tone(freq,time,duration,type,volume){if(!soundOn)return;try{if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)()}if(audio.state==="suspended")audio.resume();var o=audio.createOscillator(),g=audio.createGain();o.type=type||"sine";o.frequency.setValueAtTime(freq,audio.currentTime+time);g.gain.setValueAtTime(.001,audio.currentTime+time);g.gain.exponentialRampToValueAtTime(volume||.1,audio.currentTime+time+.012);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+time+duration);o.connect(g);g.connect(audio.destination);o.start(audio.currentTime+time);o.stop(audio.currentTime+time+duration+.03)}catch(e){}}
function sfx(type){if(type==="hit"){tone(180,0,.2,"sawtooth",.11);tone(90,0,.27,"triangle",.18);tone(550,.08,.12,"square",.04);tone(880,.19,.13,"sine",.11);tone(1180,.32,.15,"sine",.11)}else if(type==="wrong"){tone(170,0,.12,"triangle",.065);tone(145,.1,.16,"triangle",.065)}else{tone(680,0,.07,"sine",.05)}}
function buzz(seq){try{if(navigator.vibrate)navigator.vibrate(seq)}catch(e){}}
function renderStart(){mode="start";hdr();app.innerHTML='<div class="kicker">10 CASES · ONE TAP</div><div class="hero">読んで、<br><em>嘘をタップ。</em></div><p class="intro">短い証拠を読んだら、<br>事実と食い違う語句を1つタップ。</p><div class="hero-icon" style="height:140px;font-size:80px">⚡🔎</div><div class="pillrow"><span class="pill">👆 1タップ</span><span class="pill">⚡ 自動で次へ</span><span class="pill">🔥 10問コンボ</span></div><button class="cta" data-action="start">'+(index>0&&index<10?'続きから遊ぶ ⚡':'すぐに遊ぶ ⚡')+'</button>'+(index>0?'<button class="secondary" data-action="restart">最初から遊ぶ</button>':'')+'<p class="tiny">正解は各問題に1つ。証言を直接タップ。</p>'}
function renderQuestion(){
 if(index>=puzzles.length){renderEnd();return}
 mode="question";locked=false;hdr();var p=puzzles[index];
 var words=p.parts.map(function(part,i){
  return i===3?'<span class="v5-plain">'+part+'</span>':'<button class="v5-word" type="button" data-action="answer" data-i="'+i+'">'+part+'</button>';
 }).join("");
 app.innerHTML='<div class="qtop"><span class="qnum">CASE '+String(index+1).padStart(2,"0")+' / 10</span><span class="streak">🔥 '+streak+' COMBO</span></div><div class="meter"><i style="width:'+(index/10*100)+'%"></i></div><section class="v5-card"><div class="v5-title"><span>'+p.icon+'</span><b>'+p.title+'</b></div><div class="v5-fact">確定した事実</div><div class="v5-situation">'+contexts[index]+'</div><div class="v5-speaker">🗣 '+p.who+'の証言</div><div class="v5-quote">「'+words+'」</div></section><div class="v5-prompt">☝ 事実と食い違う語句を1つタップ！</div><div id="feedback" class="v5-feedback" role="status"></div><div class="bottom"><small>正解で約1秒後に次へ</small><button class="skip" data-action="skip" type="button">スキップ ›</button></div>';
}
function showWin(p){var layer=document.createElement("div");layer.className="overlay v5-win";layer.id="win-overlay";layer.innerHTML='<div class="burst-bg"></div><div class="ring"></div><div class="flash"></div><div class="wincontent"><div class="winlabel">CONTRADICTION!</div><div class="wintitle">矛盾、<br>粉砕ッ！</div><div class="explain">'+p.why+'</div><div class="nextcount">タップで次へ ▶</div></div>';layer.addEventListener("click",next);document.body.appendChild(layer);overlayTimer=setTimeout(next,1050)}
function next(){if(mode!=="win")return;clearTimeout(overlayTimer);overlayTimer=null;var layer=document.getElementById("win-overlay");if(layer)layer.remove();index++;wrongChoices={};persist();index>=puzzles.length?renderEnd():renderQuestion()}
function answer(i){if(locked||mode!=="question")return;var p=puzzles[index];if(i===p.a){locked=true;mode="win";streak++;score++;if(streak>best)best=streak;persist();sfx("hit");buzz([35,22,60]);showWin(p)}else{if(wrongChoices[i])return;wrongChoices[i]=true;misses++;streak=0;persist();sfx("wrong");buzz(45);var b=app.querySelector('[data-i="'+i+'"]');if(b){b.classList.add("wrong");b.disabled=true}var scene=app.querySelector(".v5-card");if(scene){scene.classList.remove("shake");void scene.offsetWidth;scene.classList.add("shake")}var fb=document.getElementById("feedback");if(fb)fb.textContent="そこじゃない！ もう一度。";}}
function skip(){if(locked||mode!=="question")return;streak=0;wrongChoices={};index++;persist();sfx("tap");index>=puzzles.length?renderEnd():renderQuestion()}
function renderEnd(){mode="end";hdr();app.innerHTML='<div class="result"><div class="kicker">ALL CASES CLEARED</div><div class="trophy">'+(score===10&&misses===0?'🏆':'🎖️')+'</div><h1>推理、終了！</h1><p class="intro">サクッと10事件。次は全問一撃を目指そう。</p><div class="value">'+score+' / 10</div><div class="statrow"><div class="stat"><b>'+best+'</b><small>最高コンボ</small></div><div class="stat"><b>'+misses+'</b><small>ミスタップ</small></div><div class="stat"><b>10</b><small>全事件数</small></div></div><button class="cta" data-action="restart">もう一度、推理する ⚡</button><p class="tiny">証言から矛盾する言葉を直接タップ。</p></div>'}
function restart(){clearTimeout(overlayTimer);var layer=document.getElementById("win-overlay");if(layer)layer.remove();index=0;streak=0;score=0;misses=0;wrongChoices={};persist();renderQuestion()}
app.addEventListener("click",function(e){var b=e.target.closest("button[data-action]");if(!b)return;var action=b.dataset.action;if(action==="start"){wrongChoices={};renderQuestion()}else if(action==="restart"){restart()}else if(action==="answer"){answer(Number(b.dataset.i))}else if(action==="skip"){skip()}});
soundBtn.addEventListener("click",function(){soundOn=!soundOn;persist();hdr();if(soundOn)sfx("tap")});
hdr();if(index>=10)renderEnd();else renderStart();
})();
</script></body></html>
