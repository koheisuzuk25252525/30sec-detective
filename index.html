modal .doc-body{background:#f6edda;border-radius:10px;color:#253145;padding:15px;font-size:14px;font-weight:700;margin:15px 0;line-height:1.8;white-space:pre-line}.modal .actions{display:flex;gap:8px}.modal .actions button{flex:1}.overlay{z-index:20;background:#050b14eb;text-align:center;overflow:hidden}.overlay .blast{position:absolute;inset:-60px;background:radial-gradient(circle,#efbe7760,transparent 60%);animation:blast 1.3s ease both;pointer-events:none}.overlay .charge{font-size:11px;font-weight:900;color:var(--teal);letter-spacing:.25em}.overlay .burst{font-size:clamp(36px,10vw,56px);font-weight:1000;line-height:1.2;color:var(--gold);filter:drop-shadow(0 0 15px #ffbf6b);animation:slam .5s cubic-bezier(.15,1.5,.4,1) both;max-width:440px;margin:12px auto}.overlay .tokens{display:flex;justify-content:center;gap:7px;align-items:center;margin:23px 0}.overlay .tokens span{font-size:11px;border:1px solid #b9985e;background:#382e2b;border-radius:8px;padding:10px;max-width:140px}.overlay .verdict{color:#e9e6d6;font-size:13px}.results-emoji{font-size:65px;text-align:center;margin:14px 0}.score{font-size:42px;font-weight:1000;color:var(--gold);text-align:center}.summary-list{display:flex;gap:8px;margin:18px 0}.summary-list .stamp{flex:1;font-size:10px;border:1px solid #57707e;border-radius:10px;padding:10px 3px;text-align:center;background:#18293d}.summary-list b{display:block;font-size:18px;color:var(--gold)}.choice-label{font-size:12px;font-weight:900;margin:18px 0 8px;color:#d6e9e6}.choices{display:grid;gap:7px}.choice{width:100%;text-align:left;border-radius:11px;padding:12px 13px;border:1px solid #527085;background:#1e3347;color:#e3edec;font-size:13px;font-weight:700}.choice.on{background:#514135;border:2px solid var(--gold);padding:11px 12px;color:#fff0c8}.memory{border-left:2px solid #65b7a3;padding:10px 12px;margin:10px 0;background:#1c3142;font-size:12px;color:#c9e1df}.ending-art{margin:17px 0 20px;text-align:center;font-size:74px;filter:drop-shadow(0 12px 25px #efb66e66)}.credits{text-align:center;margin-top:29px;padding:24px 0;border-top:1px solid #506478;color:#a9c0ca;font-size:12px}.ending-title{text-align:center;font-size:44px;font-family:Georgia,serif;color:var(--gold);letter-spacing:.03em;margin:20px 0 7px}.footnote{font-size:10px;color:#8fa8b7;text-align:center;margin:18px 0}.replay{margin-top:14px} @keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes slam{0%{opacity:0;transform:scale(2.1) rotate(-6deg)}60%{opacity:1;transform:scale(.91)}100%{opacity:1;transform:scale(1)}}@keyframes blast{0%{opacity:0;transform:scale(.5)}35%{opacity:.8}100%{opacity:0;transform:scale(1.6)}}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}@media (min-width:700px){#game{margin:16px auto;min-height:calc(100vh - 32px);border:1px solid #405367;border-radius:18px}}@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),root=$('#game'),screen=$('#screen'),portal=$('#portal');
const cases=[
{title:'閉店後の客',loc:'喫茶店・カナリア',icon:'☕',color:'#a87b5a',brief:'21時に閉店した喫茶店。だが、その後に荷物が受け渡されたという情報がある。',mission:'「閉店後、荷物は渡していない」という証言を覆せ。',clues:[['📓','営業日誌','店主が記入した日誌','10月22日 21:00／閉店処理完了。'],['🧾','受付控え','カウンターの控え','21:17／預かり品 07番箱／受付・黒田。'],['📦','配送受領控え','ドライバーの控え','21:20／喫茶店カナリアより「07番箱」を受領。'],['☕','コーヒーカップ','カウンターの片隅','少し残っている。いつ飲んだかは不明。']],witness:[['👨🏻','黒田・店主','21時に閉めた後、荷物は一切渡していません。'],['👩🏻','美咲・店員','21時には客席の明かりを消しました。'],['👨🏽','佐伯・配送員','夜に資料館方面へ荷物を運びました。']],correct:[1,2],person:0,reason:'21:17に07番箱を預かった記録と、21:20に同じ箱を配送員へ渡した受領控えがある。閉店後に荷物を渡していないという黒田の証言は矛盾する。',confession:'黒田「……確かに箱は渡しました。でも、理由までは話せません」',reward:'07番箱',msg:'「07番箱。そう、それを探して。」'},
{title:'開かないはずの扉',loc:'市立資料館・西書庫',icon:'📚',color:'#6b8290',brief:'21:30以降は一度も開かなかったという書庫の扉。しかし、夜の廊下で物音を聞いた人がいる。',mission:'「21:30以降、西書庫の扉は開いていない」という証言を覆せ。',clues:[['🔐','電子錠履歴','錠前のシステムログ','21:46／認証成功／カード K-03／解錠指令。'],['🚪','扉センサー','開閉検知記録','21:47／西書庫／開扉状態を検出。'],['🪪','職員カード台帳','登録者の一覧','K-03／資料管理責任者・津田。'],['📕','返却図書','返却印のある本','返却日時 20:55。21時以降の記録はない。']],witness:[['👩🏻','中原・司書','21時半以降、西書庫の扉は一度も開いていません。'],['👷🏻','宮本・清掃員','21時50分ごろ、廊下で足音を聞きました。'],['👨🏽','佐伯・配送員','荷物を置いた後、別棟へ向かいました。']],correct:[0,1],person:0,reason:'電子錠が21:46に解錠指令を受け、21:47には扉センサーが実際の開扉を検知。解錠記録だけなら開いたとは限らないが、この2つで開扉が確認できる。',confession:'中原「扉は確かに開きました。でも、あの人を責めないでください……」',reward:'K-03',msg:'「07番箱はどこへ？　カードK-03を覚えておいて。」'},
{title:'映ってはいけないもの',loc:'資料館・地下展示棟',icon:'📹',color:'#668985',brief:'警備員は23時以降の地下への出入りを否定した。だが、監視設備には奇妙な記録が残っている。',mission:'「23時以降、地下へ人も荷物も入っていない」という証言を覆せ。',clues:[['📸','監視映像の静止画','地下入口のカメラ','23:12／「07」と書かれた箱を持つ人物が地下入口に到着。'],['🪪','地下入室ログ','カードリーダーの記録','23:13／カードK-03で地下保管庫B-12に入室。'],['🏆','展示管理票','展示室の搬入記録','当日の通常搬入は22:00に完了している。'],['⚙️','設備点検票','設備担当の点検記録','22:30／シャッター・監視設備とも異常なし。']],witness:[['👮🏻','遠藤・警備員','23時以降、地下には人も荷物も入っていません。'],['👩🏻','桐生・学芸員','展示室は予定どおり閉めました。'],['🧑🏻','本田・設備係','建物の設備は正常でした。']],correct:[0,1],person:0,reason:'23:12に07番箱を持つ人物が地下入口へ到着し、23:13にはK-03で保管庫B-12への入室が記録されている。警備員の証言は成立しない。',confession:'遠藤「俺たちは……盗もうとしたんじゃない！」',reward:'B-12',msg:'「3つとも解いた。今度は3つの記録をつなげて。」'}
];
const finalQuestions=[{question:'移動していた荷物は？',options:['15番の書類袋','07番箱','展示用のトロフィー'],correct:1},{question:'西書庫と地下保管庫で使われたカードは？',options:['K-03','R-07','K-30'],correct:0},{question:'荷物の最後の保管先は？',options:['資料館の屋上','喫茶店の倉庫','地下保管庫B-12'],correct:2}];
let unlocked=0,chapter=0,phase='home',seen=new Set(),selected=[],suspect=-1,remaining=30,misses=0,interval=null,lastTick=0,finalPicked=[-1,-1,-1],endingPage=0,overlayTimeout=null,muted=false,audio=null,toastTimer=null;
try{const saved=JSON.parse(localStorage.getItem('detective30_v2_save')||'null');if(saved&&Number.isInteger(saved.unlocked))unlocked=Math.max(0,Math.min(3,saved.unlocked));if(saved&&typeof saved.muted==='boolean')muted=saved.muted}catch(e){}
function persist(){try{localStorage.setItem('detective30_v2_save',JSON.stringify({unlocked,muted}))}catch(e){}}
function updateHeader(){$('#progress').textContent=unlocked===3?'FINAL UNLOCKED':`STORY ${unlocked}/3`;$('#mute').textContent=muted?'♪ OFF':'♪ ON'}
function setScreen(markup){clearTimer();clearPortal();screen.innerHTML=markup;screen.style.animation='none';void screen.offsetHeight;screen.style.animation='appear .28s ease';updateHeader();window.scrollTo(0,0)}
function clearPortal(){if(overlayTimeout){clearTimeout(overlayTimeout);overlayTimeout=null}portal.innerHTML=''}
function clearTimer(){if(interval){clearInterval(interval);interval=null}}
function sound(kind){if(muted)return;try{const AudioContext=window.AudioContext||window.webkitAudioContext;if(!AudioContext)return;if(!audio)audio=new AudioContext();if(audio.state==='suspended')audio.resume();let t=audio.currentTime;function tone(freq,dur,offset=0,type='sine',vol=.09,endFreq){const osc=audio.createOscillator(),gain=audio.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,t+offset);if(endFreq)osc.frequency.exponentialRampToValueAtTime(endFreq,t+offset+dur);gain.gain.setValueAtTime(.001,t+offset);gain.gain.exponentialRampToValueAtTime(vol,t+offset+.02);gain.gain.exponentialRampToValueAtTime(.001,t+offset+dur);osc.connect(gain);gain.connect(audio.destination);osc.start(t+offset);osc.stop(t+offset+dur+.01)}if(kind==='tap')tone(560,.07,0,'sine',.035);if(kind==='open'){tone(600,.12,0,'sine',.04);tone(900,.13,.07,'sine',.035)}if(kind==='tick')tone(480,.05,0,'square',.018);if(kind==='wrong'){tone(220,.28,0,'sawtooth',.075,110);tone(140,.2,.1,'triangle',.055)}if(kind==='win'){tone(100,.22,0,'sawtooth',.1,65);tone(470,.2,.2,'triangle',.1);tone(590,.2,.35,'triangle',.1);tone(790,.47,.5,'triangle',.12)}if(kind==='end'){tone(392,.4,0,'sine',.09);tone(494,.4,.26,'sine',.08);tone(587,.42,.53,'sine',.08);tone(784,.9,.86,'sine',.11)}}catch(e){}}
function buzz(pattern){try{if(navigator.vibrate)navigator.vibrate(pattern)}catch(e){}}
function pop(text){const old=$('.toast');if(old)old.remove();if(toastTimer)clearTimeout(toastTimer);const n=document.createElement('div');n.className='toast';n.textContent=text;root.appendChild(n);toastTimer=setTimeout(()=>n.remove(),2500)}
function btn(text,action,extra=''){return `<button type="button" class="primary" data-act="${action}" ${extra}>${text}</button>`}
function pageTop(code,title,label='FILE'){return `<div class="page-top"><div><div class="eyebrow">${label} 0${code} / 03</div><h2>${title}</h2></div><span class="pill gold">CASE ${code}</span></div>`}
function home(){phase='home';const count=unlocked;setScreen(`<div class="eyebrow">THIRTY SECOND DETECTIVE · STORY EDITION</div><h1>その嘘、<br><em>30秒</em>で暴け。</h1><p class="lead">3つの嘘が、1つの真実につながる。<br>現場をじっくり調べ、30秒で矛盾を指摘せよ。</p><div class="intro-art"><div class="disc"></div><div class="emblem">⌕</div><div class="micro">THE LAST RECORD</div></div><div class="timeline"><div class="slot"><span>3</span>連続事件</div><div class="slot"><span>30s</span>指摘タイム</div><div class="slot"><span>1</span>真相</div></div>${btn(count===3?'最終推理に進む →':count>0?'捜査を再開する →':'事件ファイルを開く →','home-next')}<p class="footnote">調査時間は無制限。タイマーが動くのは推理開始後だけ。<br>進行状況はこの端末に保存されます。</p>`)}
function intro(){phase='intro';setScreen(`<div class="eyebrow">PROLOGUE / 10月22日 23:58</div><h2 style="margin:12px 0 16px">消える前に。</h2><p>閉館を翌日に控えた市立資料館。新人探偵であるあなたの端末に、差出人不明のメッセージが届いた。</p><div class="note"><div class="from">● UNKNOWN / 暗号化されたメッセージ</div><div class="line">「明日、ある記録が永遠に消される。」<br>「3人が嘘をついている。」<br>「ただし、誰も犯人とは限らない。」<br>「嘘の跡を追って。」</div></div><div class="instruction">あなたの任務：3つの事件で、それぞれ「2つの証拠」と「矛盾する証言」を見つける。</div><div class="panel soft"><b style="color:var(--gold)">遊び方は3ステップ</b><p style="margin:10px 0 0">① 現場の資料と証言を読む（時間無制限）<br>② 「推理開始」で30秒カウント開始<br>③ 証拠2つと矛盾する証言を選び、指摘！</p></div>${btn('最初の現場へ →','intro-next')}`)}
function caseIntro(){phase='case-intro';const c=cases[chapter];setScreen(`${pageTop(chapter+1,c.title,'INVESTIGATION')}<div class="case-banner" style="background:radial-gradient(circle at 50% 20%,${c.color},#132233 72%)"><span class="aura">${c.icon}</span><div class="sub">📍 ${c.loc}</div></div><p class="lead">${c.brief}</p><div class="instruction">今回の任務：${c.mission}</div><div class="panel soft"><div class="eyebrow">HOW TO PLAY</div><p style="margin:7px 0 0">まず4つの手がかりを調べ、3人の証言を読みます。証拠はどれも確認でき、正解の印は付きません。<br><b style="color:#f6dbac">読む時間は無制限</b>なので、焦らず考えましょう。</p></div>${btn('現場を調べる →','investigate')}`)}
function investigate(){phase='investigate';selected=[];suspect=-1;const c=cases[chapter];const clueCards=c.clues.map((x,i)=>`<button type="button" class="clue-btn ${seen.has(i)?'explored':''}" data-act="inspect" data-id="${i}"><span class="sym">${x[0]}</span><strong>${x[1]}</strong><small>${seen.has(i)?'✓ 調査済み · もう一度読む':'タップして調べる'}</small></button>`).join('');const people=c.witness.map((x)=>`<div class="witness" style="cursor:default"><span class="avatar">${x[0]}</span><span class="statement"><b>${x[1]}</b>「${x[2]}」</span></div>`).join('');setScreen(`${pageTop(chapter+1,c.title)}<div class="pill teal">STEP 1 / 調査中 · 時間制限なし</div><div class="instruction">今やること：資料を調べて、証言と食い違う事実を探そう。</div><div class="subinstruction">手がかりをタップすると詳しい内容を読めます。正解かどうかは表示されません。</div><div class="case-banner" style="height:100px;background:radial-gradient(circle at 50% 0%,${c.color},#132233 75%)"><span class="aura" style="font-size:50px">${c.icon}</span><div class="sub">${c.loc}</div></div><div class="eyebrow">EVIDENCE · 現場の手がかり</div><div class="cards" style="margin-top:9px">${clueCards}</div><div class="eyebrow" style="margin-top:21px">TESTIMONY · 関係者の証言</div>${people}<div class="dock"><div class="mini">証拠2つの組み合わせが見えたら、推理を開始しよう</div>${btn('推理開始 · 30秒に挑戦 →','challenge',seen.size<2?'disabled':'')}<div class="mini" style="margin:10px 0 0" id="readCount">調査済み ${seen.size}/4 · 2つ以上調べると開始できます</div></div>`)}
function inspect(i){sound('open');const item=cases[chapter].clues[i];seen.add(i);root.querySelectorAll('.clue-btn')[i].classList.add('explored');root.querySelectorAll('.clue-btn')[i].querySelector('small').textContent='✓ 調査済み · もう一度読む';const go=$('[data-act="challenge"]');if(go&&seen.size>=2)go.disabled=false;const info=$('#readCount');if(info)info.textContent=`調査済み ${seen.size}/4 · 調査は何度でも可能`;portal.innerHTML=`<div class="modal-wrap" id="modal" role="dialog" aria-modal="true" aria-label="資料詳細"><div class="modal"><span class="large-emoji">${item[0]}</span><div class="doc-head">EVIDENCE / 資料0${i+1}</div><h3 style="margin:6px 0">${item[1]}</h3><p style="margin:0">${item[2]}</p><div class="doc-body">${item[3]}</div><div class="actions"><button class="secondary" type="button" data-act="modal-close">捜査に戻る</button></div></div></div>`}
function startChallenge(){phase='challenge';remaining=30;misses=0;selected=[];suspect=-1;renderChallenge();lastTick=performance.now();interval=setInterval(tick,90);sound('open')}
function challengeEvidence(i){const at=selected.indexOf(i);if(at>=0)selected.splice(at,1);else if(selected.length<2)selected.push(i);sound('tap');refreshChallengeChoices()}
function challengePerson(i){suspect=suspect===i?-1:i;sound('tap');refreshChallengeChoices()}
function renderChallenge(){const c=cases[chapter];const evid=c.clues.map((x,i)=>`<button type="button" class="clue-btn ${selected.includes(i)?'selected':''}" data-act="pick-evidence" data-id="${i}"><span class="sym" style="font-size:19px">${x[0]}</span><strong>${x[1]}</strong><small style="font-size:10px">${x[3]}</small></button>`).join('');const wit=c.witness.map((x,i)=>`<button type="button" class="witness ${suspect===i?'selected':''}" data-act="pick-person" data-id="${i}"><span class="avatar">${x[0]}</span><span class="statement"><b>${x[1]}</b>「${x[2]}」</span></button>`).join('');setScreen(`${pageTop(chapter+1,c.title,'DEDUCTION')}<span class="pill gold">STEP 2 / 30秒推理</span><div class="instruction" id="objective">証拠を2つ選び、矛盾する証言者を1人選ぼう。</div><div class="timerbox always"><span class="time" id="timeLeft">30.0</span><div class="meter"><i id="timeMeter"></i></div><span class="pill" id="mistakes">誤答 0/2</span></div><div class="eyebrow">① 根拠になる証拠を2つ選ぶ <span id="eCount">(${selected.length}/2)</span></div><div class="cards" style="margin:9px 0 18px">${evid}</div><div class="eyebrow">② 矛盾する証言者を1人選ぶ</div>${wit}<div class="dock">${btn('証拠と証言を選んでください','accuse','disabled')}<div class="mini" style="margin:10px 0 0">誤答 −8秒 / 2回間違えると再挑戦</div></div>`)}
function refreshChallengeChoices(){document.querySelectorAll('[data-act="pick-evidence"]').forEach((b,i)=>{b.classList.toggle('selected',selected.includes(i));b.setAttribute('aria-pressed',selected.includes(i))}) ;document.querySelectorAll('[data-act="pick-person"]').forEach((b,i)=>{b.classList.toggle('selected',suspect===i);b.setAttribute('aria-pressed',suspect===i)});const b=$('[data-act="accuse"]');const ready=selected.length===2&&suspect>=0;if(b){b.disabled=!ready;b.textContent=ready?'矛盾を指摘する！ ⚡':'証拠と証言を選んでください'}const count=$('#eCount');if(count)count.textContent=`(${selected.length}/2)`}
function paintTimer(){const el=$('#timeLeft'),bar=$('#timeMeter');if(el){el.textContent=Math.max(0,remaining).toFixed(1);el.classList.toggle('danger',remaining<=8)}if(bar)bar.style.width=`${Math.max(0,remaining)/30*100}%`}
function tick(){if(phase!=='challenge'){clearTimer();return}if(document.hidden){lastTick=performance.now();return}const now=performance.now(),before=remaining;remaining=Math.max(0,remaining-(now-lastTick)/1000);lastTick=now;if(Math.ceil(before)!==Math.ceil(remaining)&&remaining<=5&&remaining>0)sound('tick');paintTimer();if(remaining<=0)fail('時間切れ！')}
function accuse(){if(phase!=='challenge'||selected.length!==2||suspect<0)return;const c=cases[chapter],ok=suspect===c.person&&selected.slice().sort().join(',')===c.correct.slice().sort().join(',');if(ok){clearTimer();phase='victory';sound('win');buzz([80,30,120]);const cards=selected.map(i=>c.clues[i][1]);portal.innerHTML=`<div class="overlay" role="alert"><div class="blast"></div><div><div class="charge">CONTRADICTION FOUND</div><div class="burst">その証言、<br>矛盾している。</div><div class="tokens"><span>${cards[0]}</span><span style="border:0;background:none;font-size:25px;padding:0">×</span><span>${cards[1]}</span></div><div class="verdict">▶ 証言の矛盾を証明した！</div></div></div>`;overlayTimeout=setTimeout(()=>{portal.innerHTML='';overlayTimeout=null;caseSolved()},2600)}else{misses++;remaining=Math.max(0,remaining-8);paintTimer();sound('wrong');buzz([70,50,70]);const stamp=$('#mistakes');if(stamp)stamp.textContent=`誤答 ${misses}/2`;const main=$('#screen');main.classList.remove('shake');void main.offsetWidth;main.classList.add('shake');pop('その組み合わせでは証言を覆せない。別の根拠を考えよう。 −8秒');if(misses>=2||remaining<=0){fail('指摘失敗！')}}}
function fail(title){if(phase!=='challenge')return;clearTimer();phase='failed';sound('wrong');setScreen(`<div class="eyebrow">INVESTIGATION FAILED</div><div class="results-emoji">⌛</div><h2 style="text-align:center">${title}</h2><p style="text-align:center">資料を整理して、もう一度挑戦しよう。<br>全ての証拠は再び確認できる。</p><div class="panel"><b style="color:var(--gold)">推理のコツ</b><p style="margin:6px 0 0">「単体では証明できないこと」を2つの資料で示せないか考えてみよう。矛盾している人物が事件の犯人とは限らない。</p></div>${btn('調査からやり直す ↻','retry')}`)}
function caseSolved(){const c=cases[chapter];unlocked=Math.max(unlocked,chapter+1);persist();phase='solved';setScreen(`<div class="eyebrow">CASE 0${chapter+1} · CONTRADICTION PROVEN</div><div class="results-emoji">✧</div><h2 style="text-align:center">矛盾、立証。</h2><p style="text-align:center;color:var(--teal)">CASE CLOSED</p><div class="panel"><div class="eyebrow">THE REASON · 根拠</div><p style="margin:7px 0 0;color:#f0e7d6">${c.reason}</p></div><div class="note"><div class="from">WITNESS REACTION</div><div class="line" style="font-size:13px">${c.confession}</div></div><div class="panel" style="text-align:center"><div class="eyebrow">NEW RECORD OBTAINED</div><h2 style="font-size:33px;color:var(--gold);margin:8px 0">${c.reward}</h2><p style="margin:0">事件をつなぐ記録を入手した。</p></div><div class="note"><div class="from">● UNKNOWN</div><div class="line" style="font-size:13px">${c.msg}</div></div>${btn(chapter===2?'最終推理へ →':'次の事件へ →','advance')}`)}
function finalIntro(){phase='final-intro';setScreen(`<div class="eyebrow">FINAL CASE · UNLOCKED</div><h2 style="margin-top:11px">07番箱の真相</h2><div class="summary-list"><div class="stamp"><b>07</b>喫茶店</div><div class="stamp"><b>K-03</b>西書庫</div><div class="stamp"><b>B-12</b>地下保管庫</div></div><p class="lead">3人の嘘を見抜いた。だが、誰が何を、どこへ運んだのか。記録はまだバラバラのままだ。</p><div class="note"><div class="from">● UNKNOWN</div><div class="line">「今度は3つをつなげて。」<br>「本当に消されようとしていたものが分かる。」</div></div><div class="instruction">最後の任務：事件で得た情報を使って、記録のつながりを証明しよう。</div>${btn('3つの記録をつなぐ →','final-start')}`)}
function finalQuiz(){phase='final';const blocks=finalQuestions.map((q,i)=>`<div class="choice-label">Q${i+1} ${q.question}</div><div class="choices">${q.options.map((o,j)=>`<button type="button" class="choice ${finalPicked[i]===j?'on':''}" data-act="final-pick" data-q="${i}" data-v="${j}">${o}</button>`).join('')}</div>`).join('');setScreen(`<div class="eyebrow">FINAL DEDUCTION · 時間制限なし</div><h2>3つの記録をつなげ。</h2><p>3事件を振り返り、移動経路を確定しよう。答え合わせはまとめて行う。</p><div class="memory">21:17　喫茶店で預かり品を受付<br>21:20　配送員が箱を受領<br>21:47　西書庫の扉が開く<br>23:13　地下保管庫への入室</div>${blocks}<div class="dock"><div class="mini">3問すべてに答えると真相が開きます</div>${btn('記録を照合する →','final-check',finalPicked.some(v=>v<0)?'disabled':'')}</div>`)}
function refreshFinal(){document.querySelectorAll('[data-act="final-pick"]').forEach(b=>b.classList.toggle('on',finalPicked[Number(b.dataset.q)]===Number(b.dataset.v)));const b=$('[data-act="final-check"]');if(b)b.disabled=finalPicked.some(v=>v<0)}
function finalCheck(){const all=finalPicked.every((v,i)=>v===finalQuestions[i].correct);if(!all){sound('wrong');buzz([60,60,60]);pop('3つの記録がつながらない。事件の「入手した記録」を思い出そう。');return}sound('end');phase='final-win';portal.innerHTML=`<div class="overlay" role="alert"><div class="blast"></div><div><div class="charge">ALL EVIDENCE CONNECTED</div><div class="burst">すべての記録が、<br>つながった。</div><div class="tokens"><span>07番箱</span><span>→</span><span>K-03</span><span>→</span><span>B-12</span></div><div class="verdict">地下保管庫B-12の扉が開く……</div></div></div>`;overlayTimeout=setTimeout(()=>{portal.innerHTML='';overlayTimeout=null;endingPage=0;showEnding()},3000)}
const ending=[{ey:'TRUE END / CHAPTER 1',title:'箱の中身',icon:'📼',body:'地下保管庫B-12。07番箱の中には、古いカセットテープと報告書があった。\n\n20年前の資料館火災。「職員・早瀬が独断で報知設備を停止した」とされていた事件の原本だった。',dialogue:'津田「閉館の資料整理で、あの原本が処分されると分かったんです」'}, {ey:'TRUE END / CHAPTER 2',title:'消されかけた声',icon:'🎙️',body:'テープには、早瀬の上司が報知設備の停止を指示し、早瀬が反対する会話が残されていた。\n\n早瀬は20年間、責任を押し付けられていた。',dialogue:'津田「守りたかったのは箱ではありません。あの人の名誉です」'}, {ey:'TRUE END / CHAPTER 3',title:'嘘をついた理由',icon:'🧩',body:'喫茶店主、司書、警備員。彼らは07番箱を移し、原本を守っていた。津田も自分がK-03を使ったと認めた。\n\n箱の移動経路と証言の矛盾を、独立した探偵が記録した。これで、隠されていた原本を調べ直す道が開かれた。',dialogue:'探偵「あなたたちが嘘をついたのは、記録を消すためじゃない。守るためだったんだ」'}, {ey:'TRUE END / LAST MESSAGE',title:'最後の記録',icon:'✉️',body:'匿名メッセージの送り主は、20年前の職員・早瀬の娘だった。\n\n「父の言葉を、誰かに信じてほしかった。あなたなら、証拠で確かめてくれると思ったんです」\n\n録音が静かに再生される。',dialogue:'早瀬の声「……いつか、ちゃんと調べてくれる人がいると信じています」'}];
function showEnding(){phase='ending';if(endingPage>=ending.length){trueEnd();return}const c=ending[endingPage];setScreen(`<div class="eyebrow">${c.ey}</div><div class="ending-art">${c.icon}</div><h2 style="text-align:center">${c.title}</h2><div class="panel" style="font-size:13px;white-space:pre-line;line-height:2;color:#e9e6df">${c.body}</div><div class="note"><div class="line" style="font-size:13px">${c.dialogue}</div></div>${btn(endingPage===ending.length-1?'エンディングを見る →':'続きを読む →','ending-next')}<p class="footnote">${endingPage+1} / ${ending.length}</p>`)}
function trueEnd(){phase='the-end';sound('end');setScreen(`<div class="eyebrow" style="text-align:center">THE LAST RECORD</div><div class="intro-art" style="height:185px"><div class="disc"></div><div class="emblem" style="font-size:75px">✧</div><div class="micro">THE TRUTH REMAINS</div></div><div class="ending-title">TRUE END</div><h2 style="text-align:center;color:var(--cream)">記録は、消えなかった。</h2><p style="text-align:center;line-height:2.2;margin:25px 0">あなたが暴いたのは、<b style="color:var(--gold)">3つの嘘</b>。<br>あなたが守ったのは、<b style="color:var(--teal)">1つの真実</b>。</p><div class="credits">30秒探偵 — 最後の記録<br>PROTOTYPE v2<br><br>事件の真相を追ってくれて、ありがとう。</div><button type="button" class="secondary replay" data-act="reset">最初からもう一度遊ぶ ↻</button>`)}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.id==='mute'){muted=!muted;persist();updateHeader();if(!muted)sound('tap');return}const act=b.dataset.act;if(!act)return;switch(act){case 'home-next':if(unlocked===3){finalIntro()}else if(unlocked===0)intro();else{chapter=unlocked;seen=new Set();caseIntro()}break;case 'intro-next':chapter=0;seen=new Set();caseIntro();break;case 'investigate':investigate();break;case 'inspect':inspect(Number(b.dataset.id));break;case 'modal-close':portal.innerHTML='';sound('tap');break;case 'challenge':startChallenge();break;case 'pick-evidence':if(phase==='challenge')challengeEvidence(Number(b.dataset.id));break;case 'pick-person':if(phase==='challenge')challengePerson(Number(b.dataset.id));break;case 'accuse':accuse();break;case 'retry':investigate();break;case 'advance':if(chapter===2)finalIntro();else{chapter++;seen=new Set();caseIntro()}break;case 'final-start':finalPicked=[-1,-1,-1];finalQuiz();break;case 'final-pick':finalPicked[Number(b.dataset.q)]=Number(b.dataset.v);sound('tap');refreshFinal();break;case 'final-check':finalCheck();break;case 'ending-next':endingPage++;showEnding();break;case 'reset':unlocked=0;chapter=0;seen=new Set();persist();home();break;}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal')){portal.innerHTML=''}});
document.addEventListener('visibilitychange',()=>{lastTick=performance.now()});
home();
})();
</script></body></html>
