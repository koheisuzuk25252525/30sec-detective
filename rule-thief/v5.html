<script>
(()=>{
"use strict";
const levelDefs=[
{id:"lift",title:"届かないスイッチ",scene:"高い位置のスイッチに届く物がない。",goal:"岩を浮かせて、上のスイッチを押そう",hint:"風船が持つ「浮く」は、風船専用じゃない。",device:{label:"スイッチ",icon:"🔴",on:"🟢",x:62,y:19},items:[{id:"balloon",name:"風船",icon:"🎈",x:19,y:70,kind:"balloon",traits:["float"]},{id:"rock",name:"岩",icon:"🪨",x:62,y:70,kind:"rock",traits:[]}]},
{id:"ice",title:"氷の扉",scene:"氷に閉じ込められた通路。火は手の届かない場所にある。",goal:"氷を溶かして、出口を開けよう",hint:"火そのものは動かせなくても「熱い」は動かせる。",device:{label:"出口",icon:"🚪",on:"🚪✨",x:79,y:58},items:[{id:"fire",name:"たき火",icon:"🔥",x:22,y:66,kind:"fire",traits:["hot"]},{id:"ice",name:"氷",icon:"🧊",x:68,y:66,kind:"ice",traits:[]}]},
{id:"roll",title:"坂道の荷物",scene:"箱は坂の上。坂の下にはボタンがあるが、箱は角ばって動かない。",goal:"転がる力を箱に移し、坂道を転がしてボタンを押そう",hint:"斜面を転がりやすいものから「転がる」を盗もう。",device:{label:"ボタン",icon:"🔴",on:"🟢",x:84,y:78},items:[{id:"wheel",name:"車輪",icon:"🛞",x:23,y:70,kind:"wheel",traits:["roll"]},{id:"crate",name:"箱",icon:"📦",x:52,y:70,kind:"crate",traits:[]}]},
{id:"key",title:"湖底の鍵",scene:"湖底には金属の鍵。扉の鍵穴は高い岸にあり、磁力が届く距離にも限界がある。",goal:"磁力で鍵を岩に付け、岩を浮かせて鍵穴へ運ぼう",hint:"岩に「引きよせる」と「浮く」を集める。鍵がくっついてから浮上する様子を見よう。",device:{label:"鍵穴",icon:"🔒",on:"🔓",x:54,y:21},key:{x:78,y:76},water:true,items:[{id:"balloon",name:"風船",icon:"🎈",x:16,y:62,kind:"balloon",traits:["float"]},{id:"magnet",name:"磁石",icon:"🧲",x:20,y:24,kind:"magnet",traits:["magnet"]},{id:"rock",name:"岩",icon:"🪨",x:48,y:78,kind:"rock",traits:[]}]},
{id:"light",title:"暗闇の塔",scene:"塔の上に光を届けたい。風船は浮き、ランタンは光る。",goal:"「浮く」と「光る」を同じ物に集めよう",hint:"浮きをランタンに貼っても、光を風船に貼っても成功する。",device:{label:"灯台",icon:"🏰",on:"🏰✨",x:50,y:15},items:[{id:"balloon",name:"風船",icon:"🎈",x:30,y:72,kind:"balloon",traits:["float"]},{id:"lamp",name:"ランタン",icon:"🏮",x:70,y:72,kind:"lamp",traits:["glow"]}]},
{id:"lab",title:"自由実験室",scene:"正解はない。能力を組み替えて、変な現象を発見しよう。",goal:"自由に実験して、5種類の「発見」を集めてみよう",hint:"「熱い＋転がる」「浮く＋光る」「浮く＋引きよせる」などを試そう。",water:true,items:[{id:"balloon",name:"風船",icon:"🎈",x:18,y:23,kind:"balloon",traits:["float"]},{id:"rock",name:"岩",icon:"🪨",x:50,y:23,kind:"rock",traits:[]},{id:"fire",name:"炎",icon:"🔥",x:82,y:23,kind:"fire",traits:["hot"]},{id:"wheel",name:"車輪",icon:"🛞",x:18,y:52,kind:"wheel",traits:["roll"]},{id:"magnet",name:"磁石",icon:"🧲",x:50,y:52,kind:"magnet",traits:["magnet"]},{id:"firefly",name:"蛍",icon:"✨",x:82,y:52,kind:"firefly",traits:["glow"]},{id:"ice",name:"氷",icon:"🧊",x:50,y:81,kind:"ice",traits:[]}]}
];
const names={float:"浮く",hot:"熱い",roll:"転がる",magnet:"引きよせる",glow:"光る"};
const app=document.getElementById("app"),soundEl=document.getElementById("sound");
const storeKey="rule_thief_prototype_v1";
let saved={};try{saved=JSON.parse(localStorage.getItem(storeKey)||"{}")||{}}catch(e){}
let stage=Math.max(0,Math.min(5,Number(saved.stage)||0)),unlocked=Math.max(0,Math.min(5,Number(saved.unlocked)||0)),solved=saved.solved&&typeof saved.solved==="object"?saved.solved:{},discovered=saved.discovered&&typeof saved.discovered==="object"?saved.discovered:{},soundOn=saved.sound!==false,tutorialSeen=saved.tutorialSeen===true;
let toys=[],holding=null,undoStack=[],lastMoves={},moves=0,screen="home",notice="",fxTimer=null,fx=null,help=null,audio=null,stagesWon=new Set(Object.keys(solved)),hintOpen=false;
let labShowAll=false,labFocusIds=["balloon","rock"];
let tutorialStep=0,tutorialReturnStage=0,tutorialVictory=false;
let bodies={},keyBody=null,keyAttached=false,keyPulling=false,frameId=null,motionLast=0,motionElapsed=0,goalTimer=null,goalResolved=false,worldGoal=false;
function save(){try{localStorage.setItem(storeKey,JSON.stringify({stage,unlocked,solved,discovered,sound:soundOn,tutorialSeen}))}catch(e){}}
function clone(objects){return objects.map(o=>({...o,traits:[...o.traits]}))}
function source(){return levelDefs[stage]}
function initStage(n){
 stopMotion();stopFx();
 stage=Math.max(0,Math.min(levelDefs.length-1,n));
 toys=clone(source().items);holding=null;undoStack=[];lastMoves={};moves=0;labShowAll=false;labFocusIds=["balloon","rock"];
 goalResolved=false;worldGoal=false;keyAttached=false;keyPulling=false;motionElapsed=0;
 bodies=Object.fromEntries(toys.map(o=>[o.id,{x:o.x,y:o.traits.includes("float")?Math.max(17,o.y-12):o.y,vx:0,vy:0,angle:0,melt:0}]));

 notice="ルールを盗むと、物の動きも変化する！";screen="level";hintOpen=false;save();render()
}

function beginTutorial(){
 stopMotion();stopFx();if(help){help.remove();help=null}
 tutorialReturnStage=stage;tutorialStep=0;tutorialVictory=false;screen="tutorialIntro";
 app.innerHTML='<section class="lesson-intro"><div class="lesson-kicker">PLAY & LEARN · 体験チュートリアル</div><h1>「もの」ではなく、<br><em>「性質」を盗む。</em></h1><p>この世界では、物の持つ<strong>「浮く」「熱い」などの性質</strong>を、別の物へ移動させられる。</p><div class="lesson-demo"><div>'+glyph("balloon")+'<b>風船</b></div><div class="lesson-arrow"><b>浮く →</b><small>性質を移動</small></div><div>'+glyph("rock")+'<b>岩</b></div></div><div class="lesson-rule"><b>ここが大事！</b><span>コピーではない。風船から「浮く」を盗んだら風船は落ちる。岩に貼れば、岩が浮く。</span></div><button type="button" class="lesson-primary" data-act="lessonstart">自分で試してみる ▶</button><button type="button" class="lesson-skip" data-act="lessonskip">スキップして遊ぶ</button><div class="lesson-foot">説明を読むより実際に動かして覚えよう · 約30秒</div></section>'
}
function launchGame(){if(tutorialSeen)initStage(Math.min(stage,unlocked));else beginTutorial()}

function lessonGuide(){
 if(stage!==0||!tutorialStep)return "";
 const steps={
  1:["風船から「浮く」を盗もう","下の作業台にある「浮く」を押してね。風船が浮けなくなるよ。"],
  2:["盗んだ力を岩に貼ろう","今度は「岩」をタップ。風船の力を岩に引っ越しさせよう。"],
  3:["どうなるか、よく見て！","風船は落下して、岩は上昇するよ。スイッチに届くまで見守ろう。"]
 };
 const line=steps[tutorialStep];
 return '<div class="lesson-guide" role="status" aria-live="polite"><div class="lesson-guide-top"><span>はじめてのルール泥棒</span><span>'+tutorialStep+' / 3</span></div><div class="lesson-guide-text"><span class="lesson-guide-number">'+tutorialStep+'</span><span><b>'+line[0]+'</b><small>'+line[1]+'</small></span></div><button type="button" class="lesson-mini-skip" data-act="lessonskip">スキップ ›</button></div>';
}

function isUp(o){return o.traits.includes("float")||(o.kind==="balloon"&&o.traits.includes("hot"))}
function isHot(o){return o.traits.includes("hot")}
function isGlow(o){return o.traits.includes("glow")}
function isRoll(o){return o.traits.includes("roll")&&!isUp(o)}
function has(o,t){return o&&o.traits.includes(t)}
function get(id){return toys.find(o=>o.id===id)}
function status(){return worldGoal}
function stopMotion(){
 if(frameId!==null){if(typeof cancelAnimationFrame==="function")cancelAnimationFrame(frameId);frameId=null}
 motionLast=0;

function spring(b,tx,ty,dt,frequency=19,damping=6.6){

}

 if(screen!=="level")return;
 soundEl.textContent=soundOn?"♪ ON":"♪ OFF";
 const def=source(),done=!!solved[def.id],progress=Math.min(stage,5)/5*100;
 const oldGrid=app.querySelector(".work-grid"),previousScroll=oldGrid?oldGrid.scrollLeft:0;
 const device=def.device?'<div class="device '+(status()?"success reached":"")+'" style="left:'+def.device.x+'%;top:'+def.device.y+'%"><span class="emoji">'+deviceArt(stage,status())+'</span><span class="caption">'+def.device.label+'</span></div>':'';
 const stageToys=stage===5&&!labShowAll?toys.filter(o=>labFocusIds.includes(o.id)):toys;
 const toyHTML=stageToys.map(o=>{
  const v=stateInfo(o);
  return '<button class="toy '+v.cls+(holding&&holding.from===o.id?" origin":"")+(tutorialStep===2&&stage===0&&o.id==="rock"?" teach-target":"")+'" type="button" data-act="object" data-id="'+o.id+'" aria-label="'+o.name+'を操作" style="left:'+v.x+'%;top:'+v.y+'%;transform:translate(-50%,-50%) rotate('+v.angle+'deg) scale('+(1-v.melt*.82)+');opacity:'+(1-v.melt*.57)+'"><span class="sprite">'+glyph(o.kind)+'</span><span class="name">'+o.name+'</span></button>'
 }).join("");
 const itemCard=o=>{
  if(holding){
   const isFrom=holding.from===o.id,hasTrait=has(o,holding.trait);
   return '<button class="work-object'+(isFrom||hasTrait?' unavailable':'')+(tutorialStep===2&&stage===0&&o.id==='rock'?' teach-target':'')+'" type="button" data-act="object" data-id="'+o.id+'" '+(isFrom||hasTrait||goalResolved?'disabled':'')+'><span class="mini-art">'+glyph(o.kind)+'</span><span class="work-object-name">'+o.name+'</span><span class="work-state">'+(isFrom?'盗んだ物':hasTrait?'同じ能力あり':'ここへ貼る ↘')+'</span></button>'
  }
  return '<section class="work-item"><div class="work-item-head"><span class="mini-art">'+glyph(o.kind)+'</span><span class="work-object-name">'+o.name+'</span></div><div class="work-traits">'+(o.traits.length?o.traits.map(t=>'<button class="new-trait trait-'+t+(tutorialStep===1&&stage===0&&o.id==='balloon'&&t==='float'?' teach-glow':'')+'" data-act="take" data-id="'+o.id+'" data-trait="'+t+'" type="button" '+(goalResolved?'disabled':'')+'>'+traitChip(t)+' <span aria-hidden="true">↗</span></button>').join(""):'<span class="no-trait">能力なし</span>')+'</div></section>'
 };
 const workHTML=toys.map(itemCard).join("");
 const badges=stage===5?'<section class="discovery-panel"><div class="panel-header"><b>発見ノート</b><span>'+Object.keys(discovered).length+'/5</span></div><div class="discovery-list">'+Object.entries(badgeNames).map(([id,label])=>'<div class="discovery-row '+(discovered[id]?'done':'')+'"><span>'+(discovered[id]?'✦ '+label:'◇ 未発見')+'</span><span>'+(discovered[id]?'✓':'')+'</span></div>').join("")+'</div></section>':'';
 const melt=stage===1&&has(get("ice"),"hot")?'<div class="steam" style="left:68%;top:62%">〰 〰 〰</div><div class="puddle" style="left:68%;top:76%"></div>':'';
 const tether=stage===3?'<div class="magnet-field" style="display:none"></div><div class="magnet-tether" style="display:none"></div><div class="key-token" style="left:'+(keyBody?keyBody.x:def.key.x)+'%;top:'+(keyBody?keyBody.y:def.key.y)+'%"><span class="key-symbol">'+keyArt()+'</span><span class="key-status">金属の鍵</span></div>':'';
 const hint=hintOpen?'<div class="hint-note">'+def.hint+'</div>':'';
 app.innerHTML='<div class="mission-top"><span class="mission-number">'+(stage===5?'FREE LAB':'STAGE '+String(stage+1).padStart(2,"0")+' / 05')+'</span><span class="mission-progress">'+moves+' MOVES'+(done?' · BEST '+solved[def.id]:'')+'</span></div><div class="mission-meter"><span style="width:'+progress+'%"></span></div><div class="mission-heading"><h1>'+def.title+'</h1><p>'+def.scene+'</p></div><div class="goal-strip"><span class="goal-icon">◎</span><span><b>ミッション</b><br>'+def.goal+'</span></div>'+lessonGuide()+'<section class="stage-panel"><div class="stage-topline"><span class="stage-label">FIELD / 実験フィールド</span>'+(stage===5?'<button class="lab-view-toggle" type="button" data-act="labview">'+(labShowAll?'2つに絞る':'すべて表示')+'</button>':'<span class="stage-guide">'+(holding?'貼る相手をタップ':'物をタップして能力を盗む')+'</span>')+'</div><div class="world '+(stage===5?(labShowAll?'lab-world':'focus-world'):'')+'" role="group" aria-label="'+def.title+' のシミュレーション">'+(def.water?'<div class="pond"></div>':'')+'<div class="ground"></div>'+(stage===2?'<div class="ramp"></div>':'')+(stage===4?'<div class="beam" style="opacity:'+(worldGoal?1:0)+'"></div>':'')+tether+melt+device+toyHTML+'</div><div class="notice-strip" role="status" aria-live="polite"><span class="notice-dot"></span><span class="notice-copy">'+notice+'</span></div></section><section class="workbench"><div class="workbench-top"><div><div class="workbench-brow">RULE WORKBENCH</div><h2>'+(holding?'② 貼る物を選ぶ':'① 盗むルールを選ぶ')+'</h2></div><span class="work-step">'+(holding?'STEP 2 / 2':'STEP 1 / 2')+'</span></div>'+(holding?'<div class="held-banner"><span class="held-trait">'+traitChip(holding.trait)+'</span><span>を移動中</span><button data-act="cancel" class="held-cancel" type="button">取り消す ×</button></div>':'<p class="work-hint">物の能力をタップすると、貼り付け先を選べます。</p>')+'<div class="work-grid '+(holding?'target-mode':'')+(stage===5?' lab-grid':'')+'">'+workHTML+'</div>'+(stage===5?'<div class="lab-scroll-help">↔ 横にスワイプして、ほかの物も選べます</div>':'')+'</section><div class="toolbar"><button type="button" data-act="undo" '+(!holding&&!undoStack.length?'disabled':'')+'>↶ 1手戻す</button><button type="button" data-act="reset">↻ リセット</button><button type="button" data-act="levels">▦ ステージ</button></div>'+(hintOpen?hint:'<button type="button" class="hint-launch" data-act="hint">?　ヒントを表示する</button>')+badges;
 if(stage===5){const grid=app.querySelector(".work-grid");if(grid)grid.scrollLeft=previousScroll}
 animateWorld();
}
function levelMenu(){
 stopMotion();stopFx();screen="levels";
 let html='<div class="home-kicker">WORLD DIRECTORY</div><h1 class="world-select-title">ステージを選ぶ</h1><p class="home-lead">好きな世界でルールを実験できます。クリア済みの世界は何度でも挑戦可能。</p><div class="level-directory">';
 for(let i=0;i<levelDefs.length;i++){
  const d=levelDefs[i],locked=i>unlocked&&i!==5;
  const mark=locked?"🔒":solved[d.id]!==undefined?"✓":String(i+1).padStart(2,"0");
  html+='<button class="directory-row" type="button" data-act="choose" data-i="'+i+'" '+(locked?"disabled":"")+'><span class="directory-index">'+mark+'</span><span class="directory-copy"><b>'+d.title+'</b><small>'+(locked?'前のステージをクリアすると解放':solved[d.id]!==undefined?'ベスト '+solved[d.id]+'手':'まだ挑戦していない世界')+'</small></span><span class="directory-arrow">›</span></button>'
 }
 html+='</div><button class="home-secondary" type="button" data-act="back">実験フィールドに戻る</button>';
 app.innerHTML=html
}
function helpModal(){
 if(help)return;
 const n=document.createElement("div");n.className="help-modal";n.id="helpModal";
 n.innerHTML='<div class="help-body" role="dialog" aria-modal="true" aria-label="遊び方"><div class="eyebrow">HOW TO PLAY</div><h2>物の「性質」を引っ越し。</h2><p>風船から「浮く」を盗むと、風船は落ちる。岩に貼ると岩が浮く。<br><strong>① 盗む → ② 貼る → ③ 動きを観察</strong>が基本ルールです。</p><button class="primary" id="startTutorial" type="button">さわって覚えるチュートリアル ▶</button><button class="home-secondary" style="margin-top:10px" id="closeHelp" type="button">閉じる</button></div>';
 document.body.appendChild(n);help=n;
 n.querySelector("#startTutorial").addEventListener("click",()=>{n.remove();help=null;beginTutorial()});
 n.querySelector("#closeHelp").addEventListener("click",()=>{n.remove();help=null})
}
app.addEventListener("click",e=>{
 const b=e.target.closest("button[data-act]");if(!b||b.disabled)return;
 switch(b.dataset.act){
 case "start":launchGame();break;
 case "lessonreplay":beginTutorial();break;
 case "lessonstart":tutorialStep=1;initStage(0);break;
 case "lessonskip":skipLesson();break;
 case "lab":initStage(5);break;
 case "labview":labShowAll=!labShowAll;render();break;
 case "take":take(b.dataset.id,b.dataset.trait);break;
 case "object":tapObject(b.dataset.id);break;
 case "cancel":cancelHold();break;
 case "undo":undo();break;
 case "reset":if(tutorialStep&&stage===0)tutorialStep=1;initStage(stage);break;
 case "hint":hintOpen=true;render();break;
 case "levels":if(tutorialStep){tutorialSeen=true;tutorialStep=0;save()}levelMenu();break;
 case "choose":initStage(Number(b.dataset.i));break;
 case "back":initStage(stage);break;
 }
});
soundEl.addEventListener("click",()=>{soundOn=!soundOn;soundEl.textContent=soundOn?"♪ ON":"♪ OFF";save();if(soundOn)sound("steal")});
document.getElementById("help").addEventListener("click",helpModal);
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(help){help.remove();help=null}else if(holding)cancelHold();else if(screen==="levels")initStage(stage)}});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&audio&&audio.state==="running")audio.suspend().catch(()=>{})});
initial();
})();
</script></body></html>
