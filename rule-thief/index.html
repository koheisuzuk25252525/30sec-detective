<body><div class="shell"><header class="topbar"><div class="brand">✦ <span>ルール</span>泥棒</div><div class="mini-controls"><button class="minor" id="help" type="button">？ 遊び方</button><button class="minor" id="sound" type="button">♪ ON</button></div></header><main id="app"></main><footer class="footer">RULE THIEF · 5 LITTLE WORLDS · NO SERVER REQUIRED</footer></div>
<script>
(()=>{
"use strict";
const levelDefs=[
{id:"lift",title:"届かないスイッチ",scene:"高い位置のスイッチに届く物がない。",goal:"岩を浮かせて、上のスイッチを押そう",hint:"風船が持つ「浮く」は、風船専用じゃない。",device:{label:"スイッチ",icon:"🔴",on:"🟢",x:62,y:19},items:[{id:"balloon",name:"風船",icon:"🎈",x:19,y:70,kind:"balloon",traits:["float"]},{id:"rock",name:"岩",icon:"🪨",x:62,y:70,kind:"rock",traits:[]}]},
{id:"ice",title:"氷の扉",scene:"氷に閉じ込められた通路。火は手の届かない場所にある。",goal:"氷を溶かして、出口を開けよう",hint:"火そのものは動かせなくても「熱い」は動かせる。",device:{label:"出口",icon:"🚪",on:"🚪✨",x:79,y:58},items:[{id:"fire",name:"たき火",icon:"🔥",x:22,y:66,kind:"fire",traits:["hot"]},{id:"ice",name:"氷",icon:"🧊",x:68,y:66,kind:"ice",traits:[]}]},
{id:"roll",title:"動けない荷物",scene:"ボタンは遠くにある。箱は動かない。",goal:"箱を走らせて、遠くのボタンを押そう",hint:"車輪そのものを運ぶ必要はない。",device:{label:"ボタン",icon:"🔴",on:"🟢",x:84,y:68},items:[{id:"wheel",name:"車輪",icon:"🛞",x:23,y:70,kind:"wheel",traits:["roll"]},{id:"crate",name:"箱",icon:"📦",x:52,y:70,kind:"crate",traits:[]}]},
{id:"key",title:"湖底の鍵",scene:"鍵は湖の向こう。岩は水中に沈み、磁石は岸にある。",goal:"浮く岩に磁力を持たせ、鍵を引き寄せよう",hint:"どの順番でもOK。岩に「浮く」と「引きよせる」を集めてみよう。",device:{label:"鍵",icon:"🗝️",on:"🔓",x:80,y:72},water:true,items:[{id:"balloon",name:"風船",icon:"🎈",x:18,y:54,kind:"balloon",traits:["float"]},{id:"magnet",name:"磁石",icon:"🧲",x:75,y:47,kind:"magnet",traits:["magnet"]},{id:"rock",name:"岩",icon:"🪨",x:47,y:75,kind:"rock",traits:[]}]},
{id:"light",title:"暗闇の塔",scene:"塔の上に光を届けたい。風船は浮き、ランタンは光る。",goal:"「浮く」と「光る」を同じ物に集めよう",hint:"浮きをランタンに貼っても、光を風船に貼っても成功する。",device:{label:"灯台",icon:"🏰",on:"🏰✨",x:50,y:15},items:[{id:"balloon",name:"風船",icon:"🎈",x:30,y:72,kind:"balloon",traits:["float"]},{id:"lamp",name:"ランタン",icon:"🏮",x:70,y:72,kind:"lamp",traits:["glow"]}]},
{id:"lab",title:"自由実験室",scene:"正解はない。能力を組み替えて、変な現象を発見しよう。",goal:"自由に実験して、5種類の「発見」を集めてみよう",hint:"「熱い＋転がる」「浮く＋光る」「浮く＋引きよせる」などを試そう。",water:true,items:[{id:"balloon",name:"風船",icon:"🎈",x:14,y:36,kind:"balloon",traits:["float"]},{id:"rock",name:"岩",icon:"🪨",x:45,y:68,kind:"rock",traits:[]},{id:"fire",name:"炎",icon:"🔥",x:79,y:36,kind:"fire",traits:["hot"]},{id:"wheel",name:"車輪",icon:"🛞",x:19,y:74,kind:"wheel",traits:["roll"]},{id:"magnet",name:"磁石",icon:"🧲",x:67,y:72,kind:"magnet",traits:["magnet"]},{id:"firefly",name:"蛍",icon:"✨",x:47,y:26,kind:"firefly",traits:["glow"]},{id:"ice",name:"氷",icon:"🧊",x:79,y:77,kind:"ice",traits:[]}]}
];
const names={float:"浮く",hot:"熱い",roll:"転がる",magnet:"引きよせる",glow:"光る"};
const app=document.getElementById("app"),soundEl=document.getElementById("sound");
const storeKey="rule_thief_prototype_v1";
let saved={};try{saved=JSON.parse(localStorage.getItem(storeKey)||"{}")||{}}catch(e){}
let stage=Math.max(0,Math.min(5,Number(saved.stage)||0)),unlocked=Math.max(0,Math.min(5,Number(saved.unlocked)||0)),solved=saved.solved&&typeof saved.solved==="object"?saved.solved:{},discovered=saved.discovered&&typeof saved.discovered==="object"?saved.discovered:{},soundOn=saved.sound!==false;
let toys=[],holding=null,undoStack=[],moves=0,screen="home",notice="",fxTimer=null,fx=null,help=null,audio=null,stagesWon=new Set(Object.keys(solved)),hintOpen=false;
function save(){try{localStorage.setItem(storeKey,JSON.stringify({stage,unlocked,solved,discovered,sound:soundOn}))}catch(e){}}
function clone(objects){return objects.map(o=>({...o,traits:[...o.traits]}))}
function source(){return levelDefs[stage]}
function initStage(n){stage=Math.max(0,Math.min(levelDefs.length-1,n));toys=clone(source().items);holding=null;undoStack=[];moves=0;notice="下のルールをタップして、別の物に貼ろう";screen="level";hintOpen=false;save();render()}
function isUp(o){return o.traits.includes("float")||(o.kind==="balloon"&&o.traits.includes("hot"))}
function isHot(o){return o.traits.includes("hot")}
function isGlow(o){return o.traits.includes("glow")}
function isRoll(o){return o.traits.includes("roll")&&!isUp(o)}
function has(o,t){return o&&o.traits.includes(t)}
function get(id){return toys.find(o=>o.id===id)}
function status(){
 if(stage===0)return has(get("rock"),"float");
 if(stage===1)return has(get("ice"),"hot");
 if(stage===2)return isRoll(get("crate"));
 if(stage===3)return isUp(get("rock"))&&has(get("rock"),"magnet");
 if(stage===4)return toys.some(o=>isUp(o)&&isGlow(o));
 return false
}
function audioTone(f,at,dur,type="sine",v=.10,end){if(!soundOn)return;try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume();const t=audio.currentTime+at,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(end)o.frequency.exponentialRampToValueAtTime(end,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.009);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+dur+.03)}catch(e){}}
function sound(type){if(type==="steal"){audioTone(720,0,.13,"sine",.05,380);audioTone(1150,.05,.11,"triangle",.035)}else if(type==="paste"){audioTone(330,0,.17,"triangle",.10,610);audioTone(620,.09,.15,"sine",.08,980)}else if(type==="win"){audioTone(95,0,.35,"sawtooth",.16,37);audioTone(200,0,.18,"square",.06,65);audioTone(620,.12,.17,"sine",.10);audioTone(920,.25,.16,"sine",.12);audioTone(1290,.39,.25,"triangle",.12)}else if(type==="wrong"){audioTone(150,0,.14,"sine",.05)}}
function vibrate(x){try{navigator.vibrate&&navigator.vibrate(x)}catch(e){}}
function resetNotice(s){notice=s}
function take(id,trait){
 if(screen!=="level"||holding)return;
 const o=get(id);if(!o||!has(o,trait))return;
 holding={from:id,trait,before:clone(toys)};
 o.traits=o.traits.filter(t=>t!==trait);
 resetNotice("「"+names[trait]+"」を盗んだ！貼りたい物をタップ");
 sound("steal");vibrate(20);render();
}
function cancelHold(){if(!holding)return;toys=clone(holding.before);holding=null;resetNotice("盗んだルールを元の場所へ戻した");render()}
function paste(id){
 if(screen!=="level")return;const o=get(id);if(!o)return;
 if(!holding){resetNotice("まず下にある「ルール」をタップして盗もう");render();return}
 if(id===holding.from){cancelHold();return}
 if(has(o,holding.trait)){resetNotice(o.name+"はもう「"+names[holding.trait]+"」を持っている");sound("wrong");render();return}
 const old=holding,trait=old.trait;undoStack.push(clone(old.before));o.traits.push(trait);holding=null;moves++;
 let message=o.name+"に「"+names[trait]+"」を貼った！";
 if(o.kind==="ice"&&has(o,"hot"))message="ジュワッ！ 氷が溶けた！";
 else if(isUp(o)&&has(o,"glow"))message="空に浮かぶ光が生まれた！";
 else if(o.kind==="balloon"&&has(o,"hot"))message="熱気球になった！ 熱だけで浮いた！";
 else if(isUp(o)&&has(o,"magnet"))message="浮く磁石が金属を引き寄せた！";
 else if(isRoll(o)&&has(o,"hot"))message="燃えながら転がり始めた！";
 resetNotice(message);sound("paste");vibrate([20,20,25]);checkDiscovery();
 render();
 if(status())complete();
}
function labAchievements(){
 const all=toys;
 const hasBoth=(a,b)=>all.some(o=>has(o,a)&&has(o,b));
 return {
 hotice:all.some(o=>o.kind==="ice"&&has(o,"hot")),
 lantern:hasBoth("float","glow"),
 skyMagnet:all.some(o=>isUp(o)&&has(o,"magnet")),
 hotBalloon:all.some(o=>o.kind==="balloon"&&has(o,"hot")),
 comet:all.some(o=>isRoll(o)&&has(o,"hot"))
 };
}
function checkDiscovery(){
 if(stage!==5)return;
 const found=labAchievements(),newBadges=Object.keys(found).filter(k=>found[k]&&!discovered[k]);
 if(newBadges.length){for(const id of newBadges)discovered[id]=true;notice="✦ 新発見！ "+(badgeNames[newBadges[0]]||"未知の反応")+"！";sound("win");save()}
}
const badgeNames={hotice:"とける世界",lantern:"空飛ぶ灯り",skyMagnet:"浮遊磁石",hotBalloon:"熱気球",comet:"炎の転がり玉"};
function undo(){if(holding){cancelHold();return}if(!undoStack.length)return;toys=undoStack.pop();moves=Math.max(0,moves-1);resetNotice("ひとつ前の世界に戻した");render()}
function complete(){if(screen!=="level")return;screen="win";solved[source().id]=Math.min(solved[source().id]??999,moves);unlocked=Math.max(unlocked,Math.min(stage+1,5));save();sound("win");vibrate([45,25,85,35,110]);showFx()}
function next(){stopFx();if(stage===4){initStage(5)}else initStage(Math.min(stage+1,5))}
function stopFx(){if(fxTimer!==null){clearTimeout(fxTimer);fxTimer=null}if(fx){fx.remove();fx=null}}
function showFx(){
 stopFx();const overlay=document.createElement("div");overlay.className="success-overlay";overlay.id="successOverlay";let bits="";for(let i=0;i<18;i++)bits+='<i class="spark" style="--rot:'+(i*20)+'deg;--delay:'+(i%5*17)+'ms"></i>';
 overlay.innerHTML='<div class="flash"></div><div class="ring"></div>'+bits+'<div class="inside"><div class="eyebrow">WORLD CHANGED!</div><h2>ルール、<br>いただき！</h2><p>'+source().goal.replace("よう","た")+'<br>自分の手で法則を変えた！</p><p style="font-size:11px;color:#b9e5db">'+moves+' 回の移動でクリア</p><button class="cta" id="nextLevel" type="button">'+(stage===4?"自由実験室へ ⚗️":"次のステージ ▶")+'</button><button class="try-more" id="tryAgain" type="button">同じステージを別の方法で試す</button></div>';
 document.body.appendChild(overlay);fx=overlay;
 overlay.querySelector("#nextLevel").addEventListener("click",next);
 overlay.querySelector("#tryAgain").addEventListener("click",()=>{stopFx();initStage(stage)});
}
function initial(){stopFx();screen="home";soundEl.textContent=soundOn?"♪ ON":"♪ OFF";const completed=Object.keys(solved).length;
 app.innerHTML='<div class="eyebrow">RULE THIEF · INTERACTIVE PROTOTYPE</div><h1 class="title">盗んで、貼って、<br><em>世界を変えろ。</em></h1><p class="intro-lead">風船の「浮く」を岩に。炎の「熱い」を氷に。<br>ものが持つルールを引っ越しさせる、発想のパズル。</p><div class="hero-burst"><div class="row"><span>🎈</span><span class="arrow">「浮く」→</span><span>🪨</span></div><div class="hero-note">能力を盗まれた側は、ちゃんと能力を失う。</div></div><div class="pill-list"><span class="pill">👆 タップ2回で操作</span><span class="pill">🧩 全5ステージ</span><span class="pill">⚗️ 自由実験室</span></div><button class="primary" data-act="start">'+(completed?"続きから実験する ⚡":"実験をはじめる ⚡")+'</button><p class="smallhelp">失敗しても何度でもやり直せる。<br>時間制限なし。答えを暗記する必要なし。</p>';
}
function stateInfo(o){
 let move="";
 if(isUp(o))move="translateY(-116px)";
 else if(isRoll(o))move="translateX(89px)";
 let extra=[];
 if(isUp(o))extra.push("floating");
 if(isHot(o))extra.push("hot");
 if(isGlow(o))extra.push("glow");
 if(isRoll(o))extra.push("rolled");
 if(o.kind==="ice"&&isHot(o))extra.push("melted");
 const icon=o.kind==="ice"&&isHot(o)?"💧":o.kind==="fire"&&!isHot(o)?"🪵":o.icon;
 return {move,cls:extra.join(" "),icon}
}
function render(){
 if(screen!=="level")return;
 soundEl.textContent=soundOn?"♪ ON":"♪ OFF";
 const def=source(),done=!!solved[def.id];const progress=Math.min(stage,5)/5*100;
 const device=def.device?'<div class="device '+(status()?"success":"")+'" style="left:'+def.device.x+'%;top:'+def.device.y+'%"><span class="emoji">'+(status()?def.device.on:def.device.icon)+'</span><span class="caption">'+def.device.label+'</span></div>':'';
 const toyHTML=toys.map(o=>{const v=stateInfo(o);return '<button class="toy '+v.cls+(holding?" selected-target":"")+'" type="button" data-act="object" data-id="'+o.id+'" style="left:'+o.x+'%;top:'+o.y+'%;--move:'+v.move+'"><span class="sprite">'+v.icon+'</span><span class="name">'+o.name+'</span></button>'}).join("");
 const cards=toys.map(o=>'<section class="object-card '+(holding?"target":"")+'"><div class="name-row"><span><span class="emoji">'+o.icon+'</span> '+o.name+'</span><span style="color:#aec6d0;font-size:10px">'+(isUp(o)?"↑浮遊":"")+'</span></div><div class="properties">'+(o.traits.length?o.traits.map(t=>'<button class="trait" data-act="take" data-id="'+o.id+'" data-trait="'+t+'" type="button" '+(holding?"disabled":"")+'>'+names[t]+' ↗</button>').join(""):'<span class="trait empty">ルールなし</span>')+'</div>'+(holding?'<button class="target-button" data-act="object" data-id="'+o.id+'" type="button">ここに貼る ↓</button>':'')+'</section>').join("");
 const badges=stage===5?'<div class="panel-title"><span>✦ 発見ノート</span><span class="sub">'+Object.keys(discovered).length+'/5</span></div>'+Object.entries(badgeNames).map(([id,label])=>'<div class="lab-badge '+(discovered[id]?"done":"")+'"><span>'+(discovered[id]?'✨ '+label:'🔒 ？？？')+'</span><span class="symbol">'+(discovered[id]?'✓':'')+'</span></div>').join(""):'';
 const hold=holding?'<div class="holding active"><span class="chip">'+names[holding.trait]+'</span><span>貼り先を選ぼう！</span><button class="cancel" data-act="cancel">戻す ×</button></div>':'<div class="holding"><span>👆</span><span>ルールを盗んでから、別の物をタップ</span></div>';
 app.innerHTML='<div class="topline"><span class="chapter">'+(stage===5?"⚗️ SANDBOX":"LEVEL "+(stage+1)+" / 5")+'</span><span class="chapter-info">'+moves+' MOVE'+(done?" · ✓ CLEAR":"")+'</span></div><div class="progress"><i style="width:'+progress+'%"></i></div><h1 class="level-title">'+def.title+'</h1><p class="level-goal">'+def.scene+'<br><strong>目標：'+def.goal+'</strong></p><div class="world">'+(def.water?'<div class="pond"></div>':'')+'<div class="ground"></div>'+(stage===4&&status()?'<div class="beam"></div>':'')+device+toyHTML+'<span class="sticker">✦ EXPERIMENT</span><div class="world-message pop">'+notice+'</div></div>'+hold+'<div class="panel-title"><span>ルールを盗む</span><span class="sub">選ぶ → 貼る</span></div><div class="object-grid">'+cards+'</div><div class="controls"><button class="textbutton" data-act="undo" '+(!holding&&!undoStack.length?"disabled":"")+'>↶ 1手戻す</button><button class="textbutton" data-act="reset">↻ やり直す</button><button class="textbutton" data-act="levels">☰ ステージ</button></div>'+(hintOpen?'<div class="tips">💡 '+def.hint+'</div>':'<button class="textbutton" style="width:100%" data-act="hint">💡 ヒントを見る</button>')+badges;
}
function levelMenu(){
 stopFx();screen="levels";let html='<div class="eyebrow">WORLD SELECT</div><h1 class="title" style="font-size:32px">実験する世界を選ぶ</h1><p class="intro-lead">いつでも前のステージに戻れます。</p>';
 for(let i=0;i<levelDefs.length;i++){const d=levelDefs[i],isLocked=i>unlocked;
 html+='<button class="textbutton" style="display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin:8px 0;min-height:66px" data-act="choose" data-i="'+i+'" '+(isLocked?"disabled":"")+'> <span style="font-size:25px">'+(isLocked?'🔒':i===5?'⚗️':'🧩')+'</span><span style="flex:1"><b>'+(i===5?"自由実験室":"LEVEL "+(i+1))+'　'+d.title+'</b><br><small style="color:#b7cede">'+(isLocked?'前のステージをクリアで解放':solved[d.id]?'最少 '+solved[d.id]+' 手でクリア':'未クリア')+'</small></span></button>'}
 html+='<button class="primary" style="margin-top:16px" data-act="back">今の実験に戻る</button>';
 app.innerHTML=html;
}
function helpModal(){
 if(help)return;
 const n=document.createElement("div");n.className="help-modal";n.id="helpModal";n.innerHTML='<div class="help-body" role="dialog" aria-modal="true" aria-label="遊び方"><div class="eyebrow">HOW TO STEAL A RULE</div><h2>ルールは、持ち運べる。</h2><p>① 物の下にある「浮く」「熱い」などのタグをタップ。<br>② 能力がその物から消えて、手元に移ります。<br>③ 別の物をタップして貼り付け。世界の動きが変わります。</p><p style="color:#a3ddcd">💡 正解は1つとは限りません。「1手戻す」で気軽に実験できます。</p><button class="primary" id="closeHelp" type="button">分かった！</button></div>';
 document.body.appendChild(n);help=n;n.querySelector("#closeHelp").addEventListener("click",()=>{n.remove();help=null});
}
app.addEventListener("click",e=>{
 const b=e.target.closest("button[data-act]");if(!b||b.disabled)return;
 switch(b.dataset.act){
 case "start":initStage(Math.min(stage,unlocked));break;
 case "take":take(b.dataset.id,b.dataset.trait);break;
 case "object":paste(b.dataset.id);break;
 case "cancel":cancelHold();break;
 case "undo":undo();break;
 case "reset":initStage(stage);break;
 case "hint":hintOpen=true;render();break;
 case "levels":levelMenu();break;
 case "choose":initStage(Number(b.dataset.i));break;
 case "back":initStage(stage);break;
 }
});
soundEl.addEventListener("click",()=>{soundOn=!soundOn;soundEl.textContent=soundOn?"♪ ON":"♪ OFF";save();if(soundOn)sound("steal")});
document.getElementById("help").addEventListener("click",helpModal);
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(help){help.remove();help=null}else if(holding)cancelHold();else if(screen==="levels")initStage(stage)}});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&audio&&audio.state==="running")audio.suspend().catch(()=>{})});
initial();
})();
</script></body></html>
