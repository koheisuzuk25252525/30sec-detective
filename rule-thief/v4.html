function clone(objects){return objects.map(o=>({...o,traits:[...o.traits]}))}
function source(){return levelDefs[stage]}
function initStage(n){
 stopMotion();stopFx();
 stage=Math.max(0,Math.min(levelDefs.length-1,n));

function spring(b,tx,ty,dt,frequency=19,damping=6.6){
 const d=Math.exp(-damping*dt);
 b.vx=(b.vx+(tx-b.x)*frequency*dt)*d;
 b.vy=(b.vy+(ty-b.y)*frequency*dt)*d;
 b.x=Math.max(3,Math.min(97,b.x+b.vx*dt));
 b.y=Math.max(8,Math.min(90,b.y+b.vy*dt));
}
function motionTarget(o){

 if(isUp(o)){
  if(stage===0&&o.id==="rock")y=22;
  else if(stage===3&&o.id==="rock"){x=keyAttached?52:51;y=keyAttached?24:56}
  else if(stage===4&&isGlow(o)){x=50;y=23}
  else if(stage===5)y=Math.max(16,o.y-32);
  else y=Math.max(18,o.y-27);
 }else if(isRoll(o)){
  if(stage===2&&o.id==="crate"){x=83;y=78}
  else if(stage===2&&o.id==="wheel"){x=o.x;y=o.y}
  else x=Math.min(88,o.x+26)

 return {x,y};
}

function stepMotion(timestamp){

  const target=motionTarget(o),oldX=b.x;

  else b.angle+=(-b.angle)*Math.min(1,dt*6);
  const melting=o.kind==="ice"&&isHot(o);
  b.melt=Math.min(1,Math.max(0,b.melt+(melting?dt/1.85:-dt*1.8)));

   /* Vector illustration fades and scales while the ice melts. */

   keyAttached=false;keyPulling=false;notice="磁力が消えた。鍵がゆっくり沈む…";updateWorldMessage(notice)
  }

   }

    notice="カチッ！ 鍵が岩に付いた。次は鍵穴へ運ぼう！";

   }

  }

  const tether=app.querySelector(".magnet-tether");

   if(active){
    const world=app.querySelector(".world"),w=world?world.clientWidth:350,h=world?world.clientHeight:265;
    const dx=(keyBody.x-rb.x)*w/100,dy=(keyBody.y-rb.y)*h/100;
    tether.style.left=rb.x*w/100+"px";tether.style.top=rb.y*h/100+"px";tether.style.width=Math.hypot(dx,dy)+"px";
    tether.style.transform="rotate("+Math.atan2(dy,dx)+"rad)"
   }

 }

 soundEl.textContent=soundOn?"♪ ON":"♪ OFF";
 const def=source(),done=!!solved[def.id];const progress=Math.min(stage,5)/5*100;
 const device=def.device?'<div class="device '+(status()?"success reached":"")+'" style="left:'+def.device.x+'%;top:'+def.device.y+'%"><span class="emoji">'+(status()?def.device.on:def.device.icon)+'</span><span class="caption">'+def.device.label+'</span></div>':'';
 const toyHTML=toys.map(o=>{
  const v=stateInfo(o);
  return '<button class="toy '+v.cls+'" type="button" data-act="object" data-id="'+o.id+'" style="left:'+v.x+'%;top:'+v.y+'%;transform:translate(-50%,-50%) rotate('+v.angle+'deg) scale('+(1-v.melt*.82)+');opacity:'+(1-v.melt*.57)+'"><span class="sprite">'+v.icon+'</span><span class="name">'+o.name+'</span></button>'
 }).join("");
 const cards=toys.map(o=>'<section class="object-card '+(holding?"target":"")+'"><div class="name-row"><span><span class="emoji">'+o.icon+'</span> '+o.name+'</span><span style="color:#aec6d0;font-size:10px">'+(isUp(o)?"↑浮遊":"")+'</span></div><div class="properties">'+(o.traits.length?o.traits.map(t=>'<button class="trait" data-act="take" data-id="'+o.id+'" data-trait="'+t+'" type="button" '+(holding||goalResolved?"disabled":"")+'>'+names[t]+' ↗</button>').join(""):'<span class="trait empty">ルールなし</span>')+'</div>'+(holding?'<button class="target-button" data-act="object" data-id="'+o.id+'" type="button">ここに貼る ↓</button>':'')+'</section>').join("");
 const badges=stage===5?'<div class="panel-title"><span>✦ 発見ノート</span><span class="sub">'+Object.keys(discovered).length+'/5</span></div>'+Object.entries(badgeNames).map(([id,label])=>'<div class="lab-badge '+(discovered[id]?"done":"")+'"><span>'+(discovered[id]?'✨ '+label:'🔒 ？？？')+'</span><span class="symbol">'+(discovered[id]?'✓':'')+'</span></div>').join(""):'';
 const hold=holding?'<div class="holding active"><span class="chip">'+names[holding.trait]+'</span><span>貼り先を選ぼう！</span><button class="cancel" data-act="cancel">戻す ×</button></div>':'<div class="holding"><span>🧪</span><span>ルールを移すと、物が本当に動き出す！</span></div>';
 const melt=stage===1&&has(get("ice"),"hot")?'<div class="steam" style="left:68%;top:62%">〰 〰 〰</div><div class="puddle" style="left:68%;top:76%"></div>':'';
 const keyPath=stage===3?'<div class="key-path-label">① 磁力を近づける　② 鍵を運ぶ　③ 鍵穴へ</div>':'';
 const tether=stage===3?'<div class="magnet-field" style="display:none"></div><div class="magnet-tether" style="display:none"></div><div class="key-token" style="left:'+(keyBody?keyBody.x:def.key.x)+'%;top:'+(keyBody?keyBody.y:def.key.y)+'%"><span class="key-symbol">🗝️</span><span class="key-status">金属の鍵</span></div>':'';
 app.innerHTML='<div class="topline"><span class="chapter">'+(stage===5?"⚗️ SANDBOX":"LEVEL "+(stage+1)+" / 5")+'</span><span class="chapter-info">'+moves+' MOVE'+(done?" · ✓ CLEAR":"")+'</span></div><div class="progress"><i style="width:'+progress+'%"></i></div><h1 class="level-title">'+def.title+'</h1><p class="level-goal">'+def.scene+'<br><strong>目標：'+def.goal+'</strong></p><div class="world">'+(def.water?'<div class="pond"></div>':'')+'<div class="ground"></div>'+(stage===2?'<div class="ramp"></div>':'')+(stage===4?'<div class="beam" style="opacity:'+(worldGoal?1:0)+'"></div>':'')+tether+keyPath+melt+device+toyHTML+'<span class="sticker">✦ PHYSICS LAB</span><div class="world-message pop">'+notice+'</div></div>'+hold+'<div class="panel-title"><span>ルールを盗む</span><span class="sub">選ぶ → 貼る → 動きを観察</span></div><div class="object-grid">'+cards+'</div><div class="controls"><button class="textbutton" data-act="undo" '+(!holding&&!undoStack.length?"disabled":"")+'>↶ 1手戻す</button><button class="textbutton" data-act="reset">↻ やり直す</button><button class="textbutton" data-act="levels">☰ ステージ</button></div>'+(hintOpen?'<div class="tips">💡 '+def.hint+'</div>':'<button class="textbutton" style="width:100%" data-act="hint">💡 ヒントを見る</button>')+badges;
 animateWorld();
}
function levelMenu(){
 stopMotion();stopFx();screen="levels";let html='<div class="eyebrow">WORLD SELECT</div><h1 class="title" style="font-size:32px">実験する世界を選ぶ</h1><p class="intro-lead">いつでも前のステージに戻れます。</p>';
 for(let i=0;i<levelDefs.length;i++){const d=levelDefs[i],isLocked=i>unlocked&&i!==5;
 html+='<button class="textbutton" style="display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin:8px 0;min-height:66px" data-act="choose" data-i="'+i+'" '+(isLocked?"disabled":"")+'> <span style="font-size:25px">'+(isLocked?'🔒':i===5?'⚗️':'🧩')+'</span><span style="flex:1"><b>'+(i===5?"自由実験室":"LEVEL "+(i+1))+'　'+d.title+'</b><br><small style="color:#b7cede">'+(isLocked?'前のステージをクリアで解放':solved[d.id]?'最少 '+solved[d.id]+' 手でクリア':'未クリア')+'</small></span></button>'}
 html+='<button class="primary" style="margin-top:16px" data-act="back">今の実験に戻る</button>';
 app.innerHTML=html;
}
function helpModal(){
 if(help)return;
 const n=document.createElement("div");n.className="help-modal";n.id="helpModal";n.innerHTML='<div class="help-body" role="dialog" aria-modal="true" aria-label="遊び方"><div class="eyebrow">HOW TO STEAL A RULE</div><h2>ルールは、持ち運べる。</h2><p>① 物の下にある「浮く」「熱い」などのタグをタップ。<br>② 能力がその物から消えて、手元に移ります。<br>③ 別の物をタップして貼り付け。世界の動きが変わります。</p><p style="color:#a3ddcd">💡 正解は1つとは限りません。「1手戻す」で気軽に実験できます。</p><button class="primary" id="closeHelp" type="button">分かった！</button></div>';
 document.body.appendChild(n);help=n;n.querySelector("#closeHelp").addEventListener("click",()=>{n.remove();help=null});
}
app.addEventListener("click",e=>{
 const b=e.target.closest("button[data-act]");if(!b||b.disabled)return;
 switch(b.dataset.act){
 case "start":initStage(Math.min(stage,unlocked));break;
 case "lab":initStage(5);break;
 case "take":take(b.dataset.id,b.dataset.trait);break;
 case "object":tapObject(b.dataset.id);break;
 case "cancel":cancelHold();break;
 case "undo":undo();break;
 case "reset":initStage(stage);break;
 case "hint":hintOpen=true;render();break;
 case "levels":levelMenu();break;
 case "choose":initStage(Number(b.dataset.i));break;
 case "back":initStage(stage);break;
 }
});
soundEl.addEventListener("click",()=>{soundOn=!soundOn;soundEl.textContent=soundOn?"♪ ON":"♪ OFF";save();if(soundOn)sound("steal")});
document.getElementById("help").addEventListener("click",helpModal);
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(help){help.remove();help=null}else if(holding)cancelHold();else if(screen==="levels")initStage(stage)}});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&audio&&audio.state==="running")audio.suspend().catch(()=>{})});
initial();
})();
</script></body></html>
