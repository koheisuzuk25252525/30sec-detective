{title:'閉店後の客',loc:'喫茶店・カナリア',icon:'☕',color:'#a87b5a',brief:'21時に閉店した喫茶店。だが、その後に荷物が受け渡されたという情報がある。',mission:'「閉店後、荷物は渡していない」という証言を覆せ。',clues:[['📓','営業日誌','店主が記入した日誌','10月22日 21:00／閉店処理完了。'],['🧾','受付控え','カウンターの控え','21:17／07番箱。封印番号は C-071。受付・黒田。'],['📦','配送受領控え','ドライバーの控え','21:20／封印番号 C-071 の荷物を受領。受取場所は空欄。'],['☕','コーヒーカップ','カウンターの片隅','少し残っている。いつ飲んだかは不明。']],witness:[['👨🏻','黒田・店主','21時に閉めた後、荷物は一切渡していません。'],['👩🏻','美咲・店員','21時には客席の明かりを消しました。'],['👨🏽','佐伯・配送員','夜に資料館方面へ荷物を運びました。']],correct:[1,2],person:0,reason:'受付控えの「C-071」と配送控えの「C-071」が一致。21時以降も店の箱が動いた。閉店後に荷物を渡していないという黒田の証言は矛盾する。',confession:'黒田「……確かに箱は渡しました。でも、理由までは話せません」',reward:'07番箱',msg:'「07番箱。そう、それを探して。」'},

  clearTimer();phase='victory';sound('win');buzz([45,25,80]);const names=selected.map(i=>c.clues[i][1]);const speech=c.witness[c.person][2];
  portal.innerHTML=`<div class="overlay quick-win" role="alert"><div class="shockwave"></div><div class="impact-flash"></div><div class="impact-wrap"><div class="charge">CONTRADICTION BREAK</div><div class="burst">矛盾、<br>粉砕ッ！</div><div class="shatter">✦　⚡　✧</div><div class="tokens"><span>${names[0]}</span><span>✕</span><span>${names[1]}</span></div><div class="verdict">「${speech}」<br>その嘘、見抜いた。</div><button type="button" class="skipfx" data-act="skip-win">次へ ▶</button></div></div>`;
  overlayTimeout=setTimeout(()=>{portal.innerHTML='';overlayTimeout=null;caseSolved()},1250);
 } else {
  misses++;sound('wrong');buzz(60);remaining=Math.max(0,remaining-6);paintTimer();
  const stamp=$('#mistakes');if(stamp)stamp.textContent=`誤答 ${misses}/2`;
  const el=$('#screen');el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');
  if(misses>=2||remaining<=0)resetQuick('惜しい！ 証拠の組み合わせを変えて再挑戦');
  else pop('その組み合わせでは証明できない −6秒');
 }
}
function quickRoute(i){
 if(phase!=='final')return;
 if(i!==1){sound('wrong');pop('この経路では3つの記録がつながらない');return}
 sound('win');buzz([70,40,130]);phase='final-win';
 portal.innerHTML=`<div class="overlay quick-win" role="alert"><div class="shockwave"></div><div class="impact-wrap"><div class="charge">ALL EVIDENCE CONNECTED</div><div class="burst">すべて、<br>つながった！</div><div class="tokens"><span>07番箱</span><span>→</span><span>K-03</span><span>→</span><span>B-12</span></div><button type="button" class="skipfx" data-act="skip-final">真相へ ▶</button></div></div>`;
 overlayTimeout=setTimeout(()=>{portal.innerHTML='';overlayTimeout=null;trueEnd()},1500);
}
root.addEventListener('click',function(e){
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.id==='mute'){muted=!muted;persist();updateHeader();if(!muted)sound('tap');return}
 if(b.id==='journal'){showJournal();return}
 const act=b.dataset.act;if(!act)return;
 switch(act){
 case 'home-next':if(unlocked===3)finalQuiz();else{chapter=unlocked;investigate()}break;
 case 'quick-evidence':quickEvidence(Number(b.dataset.id));break;
 case 'quick-person':quickPerson(Number(b.dataset.id));break;
 case 'quick-verdict':quickVerdict();break;
 case 'journal-close':portal.innerHTML='';break;
 case 'skip-win':clearPortal();caseSolved();break;
 case 'advance':if(chapter===2)finalQuiz();else{chapter++;investigate()}break;
 case 'quick-route':quickRoute(Number(b.dataset.id));break;
 case 'skip-final':clearPortal();trueEnd();break;
 case 'reset':unlocked=0;chapter=0;selected=[];suspect=-1;persist();home();break;
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal')){portal.innerHTML=''}});
document.addEventListener('visibilitychange',()=>{lastTick=performance.now()});
home();
})();
</script></body></html>
